name: Сборка для Windows

on:
  workflow_dispatch:          # кнопка «Run workflow» на вкладке Actions
  push:
    tags: ["v*"]              # метка вида v0.1.0 ещё и создаст релиз со ссылкой на скачивание

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Тесты
        run: python -m unittest discover -s tests -t . -v

      - name: Сборка Doska.exe
        run: pyinstaller --noconfirm --clean --windowed --onedir --name Doska --icon app.ico --add-data "index.html;." app.py

      - name: Проверка WebView2 (ставим, если нет)
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { "WebView2 уже установлен"; exit 0 }
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile wv2.exe
          Start-Process .\wv2.exe -ArgumentList '/silent','/install' -Wait
          "WebView2 установлен"

      - name: Проверка запуска (дымовой тест)
        id: smoke
        continue-on-error: true   # на первых запусках не блокирует выпуск архива; результат виден в сводке
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Doska\Doska.exe" -PassThru
          $served = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:47831/" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200 -and $r.Content.Contains("__DESKTOP__")) { $served = $true; break }
            } catch {}
          }
          Start-Sleep -Seconds 6
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("smoke.png")
          } catch { "Скриншот не удался: $_" }
          $alive = -not $p.HasExited
          $log = Join-Path $env:APPDATA "KanbanDiary\app.log"
          if (Test-Path $log) { "--- app.log ---"; Get-Content $log -Tail 30 }
          if ($alive) { Stop-Process -Id $p.Id -Force }
          "страница отдана: $served; процесс жив: $alive"
          if (-not ($served -and $alive)) { exit 1 }

      - name: Архив
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Doska -DestinationPath Doska-win64.zip
          $h = (Get-FileHash Doska-win64.zip -Algorithm SHA256).Hash
          "$h  Doska-win64.zip" | Out-File Doska-win64.zip.sha256 -Encoding ascii
          "### Сборка завершена`nSHA-256: ``$h```nПроверка запуска: **${{ steps.smoke.outcome }}**" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: Doska-win64
          path: |
            Doska-win64.zip
            Doska-win64.zip.sha256
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: smoke.png
          if-no-files-found: ignore

      - name: Релиз (только для меток v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Doska-win64.zip
            Doska-win64.zip.sha256
