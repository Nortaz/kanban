  var modalEl = $('modal');
  modalEl.addEventListener('dragover', function(e) {
    if (!editingState || !$('mImageSection')) return;
    if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      modalEl.classList.add('dragover');
    }
  });
  modalEl.addEventListener('dragleave', function(e) {
    if (!modalEl.contains(e.relatedTarget)) modalEl.classList.remove('dragover');
  });
  modalEl.addEventListener('drop', async function(e) {
    if (!editingState || !$('mImageSection')) return;
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f || f.type.indexOf('image/') !== 0) return;
    e.preventDefault();
    modalEl.classList.remove('dragover');
    try {
      var r = await compressImage(f);
      editingImage = r.dataUrl;
      renderImageSection();
      toast('Картинка добавлена');
    } catch (err) { toast('Ошибка: ' + err.message); }
  });

  document.addEventListener('paste', async function(e) {
    if (!editingState || !$('mImageSection')) return;
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image/') !== -1) {
        var f = items[i].getAsFile(); if (!f) continue;
        e.preventDefault();
        try {
          var r = await compressImage(f);
          editingImage = r.dataUrl;
          renderImageSection();
          toast('Вставлено из буфера');

  /* ============================================================
     DIARY RENDER
     ============================================================ */
  function renderDiary() { renderDiarySidebar(); renderDiaryMain(); updateDiaryStat(); }

  var dFilter = { q: '', mood: '', period: '' };
  function diaryActiveFilter() { return !!(dFilter.q || dFilter.mood || dFilter.period); }
  function diaryMatches(k) {
    var e = state.diary[k];
    if (!e) return false;
    if (dFilter.mood && e.mood !== dFilter.mood) return false;
    if (dFilter.period) {
      var from = new Date(); from.setDate(from.getDate() - parseInt(dFilter.period, 10) + 1);
      if (k < dateKeyFromDate(from)) return false;
    }
    if (dFilter.q && (e.title + ' ' + e.content).toLowerCase().indexOf(dFilter.q.toLowerCase()) < 0) return false;
    return true;
  }
  function diaryListBox(root) {
    var box = root.querySelector('.diary-list-box');
    if (box) return box;
    root.innerHTML = '';
    var bar = document.createElement('div');
    bar.className = 'diary-filter';
    var mo = MOODS.map(function(m) { return '<option value="' + m.v + '">' + m.e + '</option>'; }).join('');
    bar.innerHTML = '<input type="search" placeholder="Поиск по записям…"><div class="row"><select class="f-mood"><option value="">Любое настроение</option>' + mo + '</select><select class="f-per"><option value="">Всё время</option><option value="7">7 дней</option><option value="30">30 дней</option><option value="90">90 дней</option></select></div>';
    var inp = bar.querySelector('input'), sm = bar.querySelector('.f-mood'), sp = bar.querySelector('.f-per'), tm = null;
    inp.addEventListener('input', function() { clearTimeout(tm); tm = setTimeout(function() { dFilter.q = inp.value.trim(); renderDiarySidebar(); }, 150); });
    sm.addEventListener('change', function() { dFilter.mood = sm.value; renderDiarySidebar(); });
    sp.addEventListener('change', function() { dFilter.period = sp.value; renderDiarySidebar(); });
    root.appendChild(bar);
    box = document.createElement('div');
    box.className = 'diary-list-box';
    root.appendChild(box);
    return box;
  }
  function renderDiarySidebar() {
    var sb = diaryListBox($('diarySidebar'));
    sb.innerHTML = '';
    var title = document.createElement('div');
    title.className = 'diary-sidebar-title';
    title.textContent = 'Записи';
    sb.appendChild(title);

    var keys = new Set(Object.keys(state.diary));
    keys.add(todayKey());
    var today = todayKey();
    var list = Array.from(keys).filter(function(k) {
      if (k === today) return true;
      return diaryEntryHasData(state.diary[k]);
    });
    if (diaryActiveFilter()) list = list.filter(diaryMatches);
    list.sort(function(a, b) { return b.localeCompare(a); });

    if (list.length === 0) {
      var em = document.createElement('div');
      em.className = 'diary-empty-sidebar';
      em.textContent = diaryActiveFilter() ? 'Ничего не найдено' : 'Записей пока нет';
      sb.appendChild(em);
      return;
    }

    var currentKey = state.selectedDiaryDate || todayKey();
    list.forEach(function(key) {
      var entry = state.diary[key];
      var item = document.createElement('div');
      item.className = 'diary-item';
      if (key === currentKey) item.classList.add('active');

      var dateCol = document.createElement('div');
      dateCol.className = 'diary-item-date';
      dateCol.innerHTML = '<span class="day">' + formatDayShort(key) + '</span><span class="mon">' + formatMonthShort(key) + '</span>';
      item.appendChild(dateCol);

      var body = document.createElement('div');
      body.className = 'diary-item-body';
      var t = document.createElement('div');
      t.className = 'diary-item-title';
      if (entry && entry.title.trim()) t.textContent = entry.title;
      else if (key === today) t.textContent = 'Сегодня';
      else { t.textContent = 'Без заголовка'; t.classList.add('placeholder'); }
      body.appendChild(t);

      var p = document.createElement('div');
      p.className = 'diary-item-preview';
      var preview = '';
      if (entry && entry.content.trim()) preview = entry.content.trim().split('\n')[0].slice(0, 40);
      var imgCount = entry && entry.images ? entry.images.length : 0;
      var moodEmoji = '';
      if (entry && entry.mood) {
        var m = MOODS.find(function(x){ return x.v === entry.mood; });
        if (m) moodEmoji = m.e;
      }
      p.innerHTML =
        (moodEmoji ? escapeHtml(moodEmoji) + ' ' : '') +
        (imgCount ? '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>' + imgCount + ' ' : '') +
        escapeHtml(preview || (key === today ? 'Нажми, чтобы написать' : ''));
      body.appendChild(p);
      item.appendChild(body);

      if (entry && entry.images && entry.images.length) {
        var thumb = document.createElement('img');
        thumb.className = 'diary-item-thumb';
        thumb.src = entry.images[0];
        thumb.alt = '';
        item.appendChild(thumb);
      }

      item.addEventListener('click', function() {
        if (state.selectedDiaryDate !== key) {
          state.selectedDiaryDate = key;
          save();
          renderDiary();
        }
      });
      sb.appendChild(item);
    });
  }

  function renderDiaryMain() {
    var main = $('diaryMain');
    main.innerHTML = '';
    var key = state.selectedDiaryDate || todayKey();
    var entry = state.diary[key];
    var isToday = key === todayKey();

    var inner = document.createElement('div');
    inner.className = 'diary-inner';

    var header = document.createElement('div');
    header.className = 'diary-header';
    var dw = document.createElement('div');
    var db = document.createElement('div');
    db.className = 'diary-date-big';
    db.textContent = formatDiaryFull(key);
    dw.appendChild(db);
    var wd = document.createElement('div');
    wd.className = 'diary-weekday';
    wd.textContent = formatWeekday(key);
    dw.appendChild(wd);
    header.appendChild(dw);
    if (isToday) {
      var badge = document.createElement('span');
      badge.className = 'diary-today-badge';
      badge.textContent = 'Сегодня';
      header.appendChild(badge);
    }
    inner.appendChild(header);

    var titleInput = document.createElement('input');
    titleInput.type = 'text';
    titleInput.className = 'diary-title-input';
    titleInput.placeholder = 'Заголовок записи…';
    titleInput.spellcheck = false;
    titleInput.value = entry ? entry.title : '';
    titleInput.addEventListener('input', function() {
      var e = ensureDiaryEntry(key);
      e.title = titleInput.value;
      e.updatedAt = Date.now();
      save();
      debounceDiarySidebar();
    });
    inner.appendChild(titleInput);

    // Прилипающая плашка с названием записи: появляется, когда заголовок ушёл за край экрана
    var stick = document.createElement('div');
    stick.className = 'diary-stick';
    var stickPill = document.createElement('div');
    stickPill.className = 'diary-stick-pill';
    stick.appendChild(stickPill);
    function setStick() {
      var t = titleInput.value.trim();
      stickPill.innerHTML = '<b></b><span></span>';
      stickPill.firstChild.className = t ? '' : 'empty';
      stickPill.firstChild.textContent = t || 'Без названия';
      stickPill.lastChild.textContent = key.split('-').reverse().join('.');
    }
    setStick();
    titleInput.addEventListener('input', setStick);
    stickPill.addEventListener('click', function() {
      main.scrollTo({ top: 0, behavior: 'smooth' });
      titleInput.focus({ preventScroll: true });
    });
    main.onscroll = function() {
      stick.classList.toggle('show', titleInput.getBoundingClientRect().bottom < main.getBoundingClientRect().top + 8);
    };
    inner.appendChild(stick);

    // Контекст дня: задачи → выполнено → итоги
    var dayTasks = [], doneToday = [];
    state.columns.forEach(function(col) {
      col.cards.forEach(function(card) {
        var dn = isDoneCard(card, col);
        if (card.due === key) dayTasks.push({ card: card, col: col, done: dn });
        else if (dn && doneKey(card) === key) doneToday.push({ card: card, col: col, done: true });
      });
    });
    var dayDone = dayTasks.filter(function(x) { return x.done; }).length;

    var tasksSec = document.createElement('div');
    tasksSec.className = 'diary-day-tasks';
    var tasksTitle = document.createElement('div');
    tasksTitle.className = 'diary-day-tasks-title';
    tasksTitle.textContent = '📌 Задачи дня' + (dayTasks.length ? ' · ' + dayDone + ' из ' + dayTasks.length + ' выполнено' : '');
    tasksSec.appendChild(tasksTitle);

    if (dayTasks.length) {
      var prog = document.createElement('div');
      prog.className = 'diary-day-progress';
      var progFill = document.createElement('span');
      progFill.style.width = Math.round(dayDone / dayTasks.length * 100) + '%';
      prog.appendChild(progFill);
      tasksSec.appendChild(prog);
    }

    function makeChip(item) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'diary-task-chip' + (item.done ? ' done' : '');
      var stColor = item.done ? '#34c759' : (STATUSES[item.card.status] ? STATUSES[item.card.status].color : '#8e8e93');
      chip.innerHTML =
        '<span class="dtc-dot" style="background:' + stColor + '"></span>' +
        '<span class="dtc-title">' + escapeHtml(item.card.title) + '</span>' +
        '<span class="dtc-col">' + escapeHtml(item.col.title) + '</span>';
      chip.title = item.card.title + ' — открыть карточку';
      chip.addEventListener('click', function() { openCardModal(item.col.id, item.card.id); });
      return chip;
    }
    if (dayTasks.length > 0) {
      var tasksList = document.createElement('div');
      tasksList.className = 'diary-day-tasks-list';
      dayTasks.forEach(function(item) { tasksList.appendChild(makeChip(item)); });
      tasksSec.appendChild(tasksList);
    }
    if (doneToday.length) {
      var dtTitle = document.createElement('div');
      dtTitle.className = 'diary-day-tasks-title diary-sub';
      dtTitle.textContent = '✅ Выполнено в этот день (' + doneToday.length + ')';
      tasksSec.appendChild(dtTitle);
      var dtList = document.createElement('div');
      dtList.className = 'diary-day-tasks-list';
      doneToday.forEach(function(item) { dtList.appendChild(makeChip(item)); });
      tasksSec.appendChild(dtList);
    }

    var actions = document.createElement('div');
    actions.className = 'diary-actions';

    var addTaskBtn = document.createElement('button');
    addTaskBtn.type = 'button';

  function setupDiaryDrop(el, key) {
    var counter = 0;
    el.addEventListener('dragenter', function(e) {
      if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) {
        counter++; el.classList.add('dragover');
      }
    });
    el.addEventListener('dragleave', function() {
      counter--; if (counter <= 0) { counter = 0; el.classList.remove('dragover'); }
    });
    el.addEventListener('dragover', function(e) {
      if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) {
        e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
      }
    });
    el.addEventListener('drop', async function(e) {
      e.preventDefault();
      el.classList.remove('dragover'); counter = 0;
      var files = e.dataTransfer && e.dataTransfer.files;
      if (!files || !files.length) return;
      var added = 0;
      for (var i = 0; i < files.length; i++) {
        var f = files[i];
        if (f.type.indexOf('image/') !== 0) continue;
        try {
          var r = await compressImage(f);
          var ent = ensureDiaryEntry(key);
          ent.images.push(r.dataUrl);
          ent.updatedAt = Date.now();
          added++;
        } catch (err) {}

        toast('Добавлено: ' + added);

  }

    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') petPanel.classList.remove('show'); });
    pets.forEach(function(p) {
      $('petTab-' + p.cfg.id).addEventListener('click', function() { petActive = p; renderAll(); });
    });
    $('petFeed').addEventListener('click', function() { petActive.feed(); });
    $('petDress').addEventListener('click', function() { petActive.dress(); });
    $('petSnd').addEventListener('click', function() {
      petActive.d.sound = !petActive.d.sound; petActive.save(); renderAll();
      if (petActive.d.sound) { try { petActive.cfg.sound(); } catch (e) {} }
    });
    $('petHide').addEventListener('click', function() { petActive.setHidden(!petActive.d.hidden); });
    $('petName').addEventListener('input', function() { petActive.d.name = (this.value || '').slice(0, 14); petActive.save(); });
    $('petName').addEventListener('keydown', function(e) { e.stopPropagation(); if (e.key === 'Enter') this.blur(); });
    $('helpPetToggle').addEventListener('click', function() { petWinSetOpen(!petWinState.open); });
    window.addEventListener('resize', function() {
      pets.forEach(function(p) { p.st.x = Math.max(0, Math.min(petW() - 56, p.st.x)); p.apply(); });
    });

    petWin.classList.toggle('open', petWinState.open);
    if (petWinState.open) petWinPlace();
    hen.start(0.12 + Math.random() * 0.2);
    cat.start(0.58 + Math.random() * 0.2);
    renderAll();
    setInterval(function() { renderAll(); }, 60000);
    setTimeout(function() {
      if (hen.d.hidden || !petWinState.open) return;
      hen.say((userName ? userName + ', п' : 'П') + 'ривет!', 2200);
      setTimeout(function() { if (!cat.d.hidden) cat.say('Мяу', 1600); }, 1100);
    }, 1800);
  })();

  /* ============================================================
     ТУЛБАР: окошки «Фильтры» и «Ещё», плотность карточек
     ============================================================ */
  (function() {
    var win = document.querySelector('.window');
    var fp = $('filtersPop'), mp = $('morePop'), fb = $('btnFilters'), mb = $('btnMore');
    function closeAll() { fp.classList.remove('show'); mp.classList.remove('show'); }
    function closeOthers() {
      ['helpPop', 'bgPicker', 'petPanel'].forEach(function(id) { var e = $(id); if (e) e.classList.remove('show'); });
    }
    function place(pop, btn) {
      var w = win.getBoundingClientRect(), b = btn.getBoundingClientRect();
      var pw = pop.offsetWidth || 240;
      pop.style.top = (b.bottom - w.top + 8) + 'px';
      pop.style.left = Math.max(8, Math.min(b.left - w.left, w.width - pw - 8)) + 'px';
    }
    function toggle(pop, btn) {
      var open = !pop.classList.contains('show');
      closeAll(); closeOthers();
      if (open) { pop.classList.add('show'); place(pop, btn); }
    }
    fb.addEventListener('click', function(e) { e.stopPropagation(); toggle(fp, fb); });
    mb.addEventListener('click', function(e) { e.stopPropagation(); toggle(mp, mb); });
    ['btnHelp', 'btnBg'].forEach(function(id) { $(id).addEventListener('click', closeAll); });
    document.addEventListener('click', function(e) {
      [fp, mp].forEach(function(p) { if (p.classList.contains('show') && !p.contains(e.target)) p.classList.remove('show'); });
    });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeAll(); });
    window.addEventListener('resize', closeAll);
    $('moreTemplates').addEventListener('click', function() { closeAll(); $('btnTemplates').click(); });
    $('moreExport').addEventListener('click', function() { closeAll(); $('btnExport').click(); });
    $('moreImport').addEventListener('click', function() { closeAll(); $('btnImport').click(); });
    $('moreOptimize').addEventListener('click', function() { closeAll(); optimizeAllImages(); });
    $('moreBackups').addEventListener('click', function() { closeAll(); bkOpenUI(); });

    var DKEY = 'kanban_density';
    function applyDensity(v) {
      if (v !== 'compact') v = 'comfort';
      document.documentElement.setAttribute('data-density', v);
      try { localStorage.setItem(DKEY, v); } catch (e) {}
      document.querySelectorAll('#densitySeg .seg-btn').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-density') === v); });
    }
    document.querySelectorAll('#densitySeg .seg-btn').forEach(function(b) {
      b.addEventListener('click', function() { applyDensity(b.getAttribute('data-density')); });
    });
    var saved = 'comfort';
    try { saved = localStorage.getItem(DKEY) || 'comfort'; } catch (e) {}
    applyDensity(saved);
  })();

  /* ============================================================
     ДОСКА: автопрокрутка при перетаскивании, панорама, навигатор колонок
     ============================================================ */
  var asVx = 0, asVy = 0, asRaf = 0, asIdle = 0, asHook = null;
  function asStep() {
    asRaf = 0;
    if (!asVx && !asVy) return;
    var b = $('board');
    b.scrollLeft += asVx; b.scrollTop += asVy;
    if (asHook) asHook();
    asRaf = requestAnimationFrame(asStep);
  }
  function boardAutoScroll(x, y, sticky) {
    var b = $('board'), r = b.getBoundingClientRect(), E = 90, M = 22;
    function k(v) { return Math.max(0, Math.min(1, v)); }
    asVx = x < r.left + E ? -Math.ceil(k(1 - (x - r.left) / E) * M) : x > r.right - E ? Math.ceil(k(1 - (r.right - x) / E) * M) : 0;
    asVy = y < r.top + E ? -Math.ceil(k(1 - (y - r.top) / E) * M) : y > r.bottom - E ? Math.ceil(k(1 - (r.bottom - y) / E) * M) : 0;
    clearTimeout(asIdle);
    if (asVx || asVy) {
      if (!asRaf) asRaf = requestAnimationFrame(asStep);
      if (!sticky) asIdle = setTimeout(boardAutoScrollStop, 160);
    }
  }
  function boardAutoScrollStop() { asVx = 0; asVy = 0; clearTimeout(asIdle); asHook = null; }

  var colNavQueued = false;
  function queueColNav() {
    if (colNavQueued) return;
    colNavQueued = true;
    requestAnimationFrame(function() { colNavQueued = false; renderColNav(); });
  }
  function updateColNavActive() {
    var b = $('board'), nav = $('colNav');
    if (!nav || nav.style.display === 'none') return;
    var l = b.scrollLeft, rgt = l + b.clientWidth;
    b.querySelectorAll('.column').forEach(function(colEl) {
      var dot = nav.querySelector('[data-col="' + colEl.dataset.colId + '"]');
      if (!dot) return;
      var vis = colEl.offsetLeft + colEl.offsetWidth > l + 24 && colEl.offsetLeft < rgt - 24;
      dot.classList.toggle('in', vis);
    });
  }
  function renderColNav() {
    var b = $('board'), nav = $('colNav');
    if (!nav || !b) return;
    var over = b.scrollWidth > b.clientWidth + 12 && state.columns.length > 1;
    nav.style.display = over ? 'flex' : 'none';
    if (!over) return;
    nav.innerHTML = '';
    state.columns.forEach(function(col) {
      var d = document.createElement('button');
      d.type = 'button'; d.className = 'cn-dot'; d.setAttribute('data-col', col.id);
      d.style.setProperty('--c', col.color || '#007aff');
      d.title = col.title;
      d.innerHTML = '<span></span><em>' + col.cards.length + '</em>';
      d.addEventListener('click', function() {
        var el = b.querySelector('.column[data-col-id="' + col.id + '"]');
        if (el) b.scrollTo({ left: Math.max(0, el.offsetLeft - 16), behavior: 'smooth' });
      });
      nav.appendChild(d);
    });
    updateColNavActive();
  }
  (function initBoardScroll() {
    var board = $('board');
    var nav = document.createElement('div');
    nav.className = 'col-nav'; nav.id = 'colNav';
    $('kanbanBoardTab').appendChild(nav);
    board.addEventListener('dragover', function(e) { if (dragCardId) boardAutoScroll(e.clientX, e.clientY, false); });
    document.addEventListener('dragend', boardAutoScrollStop);
    document.addEventListener('drop', boardAutoScrollStop);
    var pan = null;
    board.addEventListener('pointerdown', function(e) {
      if (e.pointerType !== 'mouse' || e.button !== 0 || e.target !== board) return;
      pan = { x: e.clientX, y: e.clientY, sl: board.scrollLeft, st: board.scrollTop, id: e.pointerId };
      board.classList.add('panning');
      try { board.setPointerCapture(e.pointerId); } catch (err) {}
    });
    board.addEventListener('pointermove', function(e) {
      if (!pan) return;
      board.scrollLeft = pan.sl - (e.clientX - pan.x);
      board.scrollTop = pan.st - (e.clientY - pan.y);
    });
    function endPan() {
      if (!pan) return;
      try { board.releasePointerCapture(pan.id); } catch (err) {}
      pan = null; board.classList.remove('panning');
    }
    board.addEventListener('pointerup', endPan);
    board.addEventListener('pointercancel', endPan);
    // Колесо над пустым местом доски и заголовками колонок листает вбок; над карточками работает обычная прокрутка
    board.addEventListener('wheel', function(e) {
      if (e.ctrlKey || e.metaKey || e.shiftKey || Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
      if (board.scrollWidth <= board.clientWidth + 2) return;
      if (e.target.closest && e.target.closest('.column-body, .card, .modal, input:not(.col-title), textarea, select')) return;
      e.preventDefault();
      board.scrollLeft += e.deltaY;
    }, { passive: false });
    var ticking = false;
    board.addEventListener('scroll', function() {
      if (ticking) return; ticking = true;
      requestAnimationFrame(function() { ticking = false; updateColNavActive(); });
    }, { passive: true });
    window.addEventListener('resize', queueColNav);
    queueColNav();
  })();

  /* ============================================================
     КЛАВИАТУРА: навигация и перемещение карточек
     ============================================================ */
  async function deleteCardConfirm(colId, cardId) {
    var col = state.columns.find(function(c) { return c.id === colId; });
    var card = col && col.cards.find(function(c) { return c.id === cardId; });
    if (!card) return;
    var ok = await confirmDialog('Удалить задачу <b>«' + escapeHtml(card.title) + '»</b>?', { title: 'Удалить задачу', okLabel: 'Удалить' });
    if (!ok) { focusCard(cardId); return; }
    col.cards = col.cards.filter(function(c) { return c.id !== cardId; });
    if (state.pomodoro.cardId === cardId) stopPomodoro();
    save(); render(); toast('Удалена');
  }
  function focusCard(id) {
    var el = document.querySelector('.card[data-card-id="' + id + '"]');
    if (el) el.focus();
  }
  function moveCardKeyboard(colId, cardId, key) {
    var ci = state.columns.findIndex(function(c) { return c.id === colId; });
    var col = state.columns[ci];
    var idx = col.cards.findIndex(function(c) { return c.id === cardId; });
    var card = col.cards[idx];
    if (!card) return;
    if (key === 'ArrowUp' || key === 'ArrowDown') {
      var ni = idx + (key === 'ArrowUp' ? -1 : 1);
      if (ni < 0 || ni >= col.cards.length) return;
      col.cards.splice(idx, 1); col.cards.splice(ni, 0, card);
    } else {
      var ti = ci + (key === 'ArrowLeft' ? -1 : 1);
      if (ti < 0 || ti >= state.columns.length) return;
      var target = state.columns[ti];
      col.cards.splice(idx, 1);
      target.cards.splice(Math.min(idx, target.cards.length), 0, card);
      card.columnEnteredAt = Date.now();
      afterColumnChange(card, target);
      if (ti === state.columns.length - 1 && state.columns.length > 1) petReward(3, 6, 'Задача завершена!');
    }
    card.updatedAt = Date.now();
    save(); render(); focusCard(cardId);
  }
  function cardKeyDown(e, col, card, el) {
    if (e.target !== el) return;
    var k = e.key;
    if (k === 'Enter' || k === ' ') { e.preventDefault(); openCardModal(col.id, card.id); return; }
    if (k === 'Delete') { e.preventDefault(); deleteCardConfirm(col.id, card.id); return; }
    if (k.indexOf('Arrow') !== 0) return;
    e.preventDefault();
    if (e.altKey) { moveCardKeyboard(col.id, card.id, k); return; }
    var body = el.parentNode;
    var cards = Array.prototype.slice.call(body.querySelectorAll(':scope > .card'));
    var i = cards.indexOf(el);
    if (k === 'ArrowUp' && i > 0) cards[i - 1].focus();
    else if (k === 'ArrowDown' && i < cards.length - 1) cards[i + 1].focus();
    else if (k === 'ArrowLeft' || k === 'ArrowRight') {
      var colEl = el.closest('.column');
      var sib = colEl && (k === 'ArrowLeft' ? colEl.previousElementSibling : colEl.nextElementSibling);
      if (sib && sib.classList.contains('column')) {
        var cs = sib.querySelectorAll('.column-body > .card');
        if (cs.length) cs[Math.min(i, cs.length - 1)].focus();
        else { var qi = sib.querySelector('.quick-input'); if (qi) qi.focus(); }
      }
    }
  }

  /* ============================================================
     ПК: платформа, фокус в модалках, синхронизация вкладок
     ============================================================ */
  (function() {
    // Бутафорские «светофоры» macOS нужны только на Mac
    if (!/Mac|iPhone|iPad|iPod/i.test(navigator.userAgent)) document.documentElement.classList.add('no-traffic');

    var modalBg = $('modalBg'), prevFocus = null, prevCardId = null, wasShown = false;
    new MutationObserver(function() {
      var shown = modalBg.classList.contains('show');
      if (shown && !wasShown) {
        prevFocus = document.activeElement;
        prevCardId = prevFocus && prevFocus.dataset ? prevFocus.dataset.cardId : null;
      } else if (!shown && wasShown) {
        setTimeout(function() {
          if (prevCardId) { var ce = document.querySelector('.card[data-card-id="' + prevCardId + '"]'); if (ce) { ce.focus(); return; } }
          if (prevFocus && document.contains(prevFocus) && prevFocus.focus) prevFocus.focus();
        }, 30);
      }
      wasShown = shown;
    }).observe(modalBg, { attributes: true, attributeFilter: ['class'] });

    // Tab не уходит из открытого окна на доску позади него
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Tab' || !modalBg.classList.contains('show')) return;
      var f = Array.prototype.slice.call($('modal').querySelectorAll('button, input, textarea, select, [tabindex]:not([tabindex="-1"])')).filter(function(x) { return !x.disabled && x.offsetParent !== null; });
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1], a = document.activeElement;
      if (!$('modal').contains(a)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
    }, true);

    // Несколько вкладок: подхватываем изменения, сделанные в другой вкладке
    window.addEventListener('storage', function(e) {
      if (e.key !== STORAGE_KEY || !e.newValue) return;
      if (persistTimer || modalBg.classList.contains('show')) return;
      if (loadFromLocalStorage()) {
        undoStack = []; redoStack = [];
        applyLoadedState();
        updateTagFilterOptions();
        pushUndoSnapshot(true);
        toast('Обновлено из другой вкладки');
      }
    });

    // Запись в подключённый файл не теряется при закрытии вкладки
    document.addEventListener('visibilitychange', function() {
      if (document.hidden && writeTimer) { clearTimeout(writeTimer); writeTimer = null; writeToFileNow(); }
    });
  })();

  async function init() {
    setupPWA();

    var dataLoaded = false;
    var fromFile = false;
    if (FSA_SUPPORTED) {
      var hasH = await initFileHandle();
      if (hasH) {
        dataLoaded = await readFromFile();
        fromFile = dataLoaded;
      }
    }
    if (!dataLoaded) dataLoaded = loadFromLocalStorage();
    if (!fromFile && !window.__DESKTOP__) {
      var mr = await mirrorLoad();
      if (mr) {
        try {
          var md = unpackBoard(JSON.parse(mr.json));
          state.columns = normalizeColumns(md.columns);
          state.diary = normalizeDiary(md.diary);
          state.templates = normalizeTemplates(md.templates);
          if (md.selectedDiaryDate) state.selectedDiaryDate = md.selectedDiaryDate;
          dataLoaded = true; mirrorActive = true;
        } catch (e) {}
      }
    }
    if (!dataLoaded) {
      seedDemo();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    initStatusFilter();
    render();
    renderStats();
    renderDiary();
    updateTabUI();
    updateStatusbar();
    updateFileUI();
    pushUndoSnapshot(true);
    updateUndoButtons();
    $('diaryDateJump').value = state.selectedDiaryDate || todayKey();

    resumePomodoro();

    if (FSA_SUPPORTED && needsPermission && fileHandle) {
      showBanner('Файл <b>' + escapeHtml(fileHandle.name) + '</b> — нужно подтвердить доступ', 'Разрешить', async function() {
        var ok = await reconnectFile();
        if (ok) { await readFromFile(); applyLoadedState(); hideBanner(); toast('Синхронизация включена'); }
        else toast('Доступ не получен');
      });
    } else if (FSA_SUPPORTED && !fileHandle) {
      setTimeout(function() {
        showBanner('Данные в браузере. Подключить файл, чтобы не потерять их при очистке кэша?', 'Выбрать файл', async function() {
          hideBanner(); openFilePickerDialog();
        });
      }, 800);
    }
    if (fromFile) toast('Загружено из ' + fileHandle.name);
    if (!userName) setTimeout(function() { askUserName(true); }, 350);
    else if (!fromFile) setTimeout(function() { toast(greeting() + ', ' + userName); }, 400);
  }
  init();
})();
</script>
<script>
/* Liquid glass: скользящая «линза» в переключателях + блик, следующий за курсором */
(function () {
  function place(seg, animate) {
    var thumb = seg._lgThumb, act = seg.querySelector('.seg-btn.active');
    if (!thumb || !act || !act.offsetWidth) return;
    if (!animate) thumb.style.transition = 'none';
    thumb.style.width = act.offsetWidth + 'px';
    thumb.style.transform = 'translateX(' + act.offsetLeft + 'px)';
    if (!animate) { void thumb.offsetWidth; thumb.style.transition = ''; }
    else { thumb.classList.remove('moving'); void thumb.offsetWidth; thumb.classList.add('moving'); }
  }
  function init(seg) {
    if (seg._lgThumb) return;
    var thumb = document.createElement('span'); thumb.className = 'lg-thumb';
    seg.insertBefore(thumb, seg.firstChild); seg._lgThumb = thumb;
    seg.classList.add('lg-ready');
    var last = null;
    function sync() {
      var a = seg.querySelector('.seg-btn.active');
      place(seg, last !== null && a !== last); last = a;
    }
    new MutationObserver(sync).observe(seg, { attributes: true, subtree: true, attributeFilter: ['class'] });
    if (window.ResizeObserver) new ResizeObserver(function () { place(seg, false); }).observe(seg);
    sync();
  }
  function initAll() { document.querySelectorAll('.segmented').forEach(init); }
  initAll();
  window.addEventListener('load', initAll);

  var raf = 0, ev = null;
  document.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;
    ev = e; if (raf) return;
    raf = requestAnimationFrame(function () {
      raf = 0;
      var tg = ev.target;
      if (!tg || !tg.closest) return;
      [tg.closest('.card'), tg.closest('.column'), tg.closest('.tpl-card')].forEach(function (t) {
        if (!t) return;
        var r = t.getBoundingClientRect();
        t.style.setProperty('--mx', (ev.clientX - r.left) + 'px');
        t.style.setProperty('--my', (ev.clientY - r.top) + 'px');
      });
    });
  }, { passive: true });
})();
</script>
