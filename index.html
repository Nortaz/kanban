<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Доска — Канбан и Дневник</title>

<meta name="theme-color" content="#2b579a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Доска">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="pwaManifest">
<link rel="apple-touch-icon" id="pwaIcon">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-window: #ececec;
    --bg-toolbar: rgba(246, 246, 246, 0.85);
    --bg-column: rgba(255, 255, 255, 0.55);
    --bg-card: #ffffff;
    --bg-modal: #ffffff;
    --bg-diary-sidebar: rgba(255,255,255,0.45);
    --text: #1d1d1f;
    --text-dim: #86868b;
    --text-soft: #48484a;
    --border: rgba(0, 0, 0, 0.08);
    --border-strong: rgba(0, 0, 0, 0.14);
    --hover: rgba(0, 0, 0, 0.05);
    --active: rgba(0, 0, 0, 0.10);
    --accent: #007aff;
    --accent-light: rgba(0, 122, 255, 0.14);
    --p-high: #ff3b30;
    --p-med:  #ff9500;
    --p-low:  #34c759;
    --ok: #34c759;
    --err: #ff3b30;
    --warn: #ff9500;
    --shadow-window: 0 30px 60px rgba(0, 0, 0, 0.25), 0 0 0 0.5px rgba(0, 0, 0, 0.15);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(0, 0, 0, 0.05);
    --shadow-card-hover: 0 4px 12px rgba(0, 0, 0, 0.10), 0 0 0 1px rgba(0, 0, 0, 0.06);
    --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  }
  [data-theme="dark"] {
    --bg-window: #1c1c1e;
    --bg-toolbar: rgba(38, 38, 40, 0.85);
    --bg-column: rgba(44, 44, 46, 0.55);
    --bg-card: #2c2c2e;
    --bg-modal: #2c2c2e;
    --bg-diary-sidebar: rgba(44,44,46,0.45);
    --text: #f5f5f7;
    --text-dim: #98989d;
    --text-soft: #c7c7cc;
    --border: rgba(255, 255, 255, 0.1);
    --border-strong: rgba(255, 255, 255, 0.16);
    --hover: rgba(255, 255, 255, 0.06);
    --active: rgba(255, 255, 255, 0.12);
    --accent-light: rgba(10, 132, 255, 0.22);
  }
  html, body {
    height: 100%;
    font-family: var(--font-ui);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body {
    background: linear-gradient(135deg, #c8d1e0 0%, #d8dce4 50%, #cfd6e0 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  [data-theme="dark"] body {
    background: linear-gradient(135deg, #1a1a1c 0%, #232326 50%, #1c1c1e 100%);
  }
  .window {
    width: 100%; max-width: 1400px;
    height: 100%; max-height: 900px;
    background: var(--bg-window);
    border-radius: 12px;
    box-shadow: var(--shadow-window);
    display: flex; flex-direction: column;
    overflow: hidden; position: relative;
  }
  @media (display-mode: standalone) {
    body { padding: 0; background: var(--bg-window); }
    .window { max-height: none; border-radius: 0; box-shadow: none; max-width: none; }
  }

  /* TITLEBAR */
  .titlebar {
    height: 38px; display: flex; align-items: center;
    padding: 0 12px;
    background: var(--bg-toolbar);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
    position: relative; user-select: none;
    flex: 0 0 auto; z-index: 5;
  }
  .traffic { display: flex; gap: 8px; align-items: center; position: absolute; left: 12px; }
  .traffic span { width: 12px; height: 12px; border-radius: 50%; display: inline-block; cursor: pointer; }
  .traffic .red { background: #ff5f57; }
  .traffic .yellow { background: #febc2e; }
  .traffic .green { background: #28c840; }
  @media (display-mode: standalone) { .traffic { display: none; } }
  #docName {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 13px; font-weight: 500; color: var(--text);
    background: transparent; border: 0; outline: none; text-align: center;
    width: 260px; padding: 3px 8px; border-radius: 6px;
    font-family: inherit; transition: background .15s;
  }
  #docName:hover { background: var(--hover); }
  #docName:focus { background: var(--active); }
  .titlebar-right { margin-left: auto; display: flex; gap: 2px; z-index: 1; align-items: center; }
  .icon-btn {
    width: 28px; height: 28px; border: 0; background: transparent;
    border-radius: 6px; cursor: pointer; color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    transition: all .12s; font-size: 14px;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }

  .clock {
    height: 28px; padding: 0 12px; border: 0; background: transparent;
    border-radius: 6px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; font-size: 12px;
    font-variant-numeric: tabular-nums; color: var(--text-dim);
    transition: all .12s; user-select: none;
    white-space: nowrap; margin-right: 2px;
  }
  .clock:hover { background: var(--hover); }
  .clock:active { background: var(--active); }
  .clock-date { font-weight: 500; text-transform: capitalize; }
  .clock-time {
    font-weight: 600; color: var(--text);
    font-family: ui-monospace, Menlo, 'SF Mono', Consolas, monospace;
    letter-spacing: .3px;
  }

  /* TOOLBAR */
  .toolbar {
    height: 50px; display: flex; align-items: center;
    padding: 0 14px; gap: 8px;
    background: var(--bg-toolbar);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto; z-index: 4;
    overflow-x: auto; scrollbar-width: none;
  }
  .toolbar::-webkit-scrollbar { display: none; }

  .segmented {
    display: inline-flex; background: var(--hover);
    border-radius: 8px; padding: 3px; gap: 2px; flex-shrink: 0;
  }
  .seg-btn {
    border: 0; background: transparent; border-radius: 6px;
    padding: 6px 14px; font-family: inherit;
    font-size: 12.5px; font-weight: 500;
    color: var(--text-dim); cursor: pointer;
    transition: all .15s; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .seg-btn:hover { color: var(--text); }
  .seg-btn.active {
    background: var(--bg-card); color: var(--text);
    box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 0 0 0.5px rgba(0,0,0,.04);
  }
  .seg-btn svg {
    width: 14px; height: 14px;
    stroke: currentColor; stroke-width: 1.8;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .segmented.small { padding: 2px; }
  .segmented.small .seg-btn { padding: 5px 11px; font-size: 12px; }

  .tbtn {
    height: 32px; padding: 0 12px;
    border: 0; background: transparent;
    border-radius: 7px; cursor: pointer;
    font-size: 13px; font-family: inherit;
    color: var(--text);
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .12s; white-space: nowrap; flex-shrink: 0;
  }
  .tbtn:hover { background: var(--hover); }
  .tbtn:active { background: var(--active); }
  .tbtn:disabled { opacity: .35; cursor: default; pointer-events: none; }
  .tbtn.primary { background: var(--accent); color: #fff; font-weight: 500; }
  .tbtn.primary:hover { background: #0066d6; }
  .tbtn.install {
    background: linear-gradient(180deg, #34c759, #2b9c48);
    color: #fff; font-weight: 600;
    box-shadow: 0 1px 3px rgba(52,199,89,.3);
  }
  .tbtn.install:hover { background: linear-gradient(180deg, #40d466, #31a854); }
  .tbtn svg {
    width: 15px; height: 15px;
    stroke: currentColor; stroke-width: 1.8;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .file-btn { max-width: 220px; padding: 0 10px 0 12px; }
  .file-btn #fileLabel {
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-size: 12.5px; max-width: 150px;
  }
  .sync-dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block; flex-shrink: 0;
    transition: background .2s;
  }
  .sync-dot.ok { background: var(--ok); }
  .sync-dot.saving { background: var(--warn); animation: pulse 1s infinite; }
  .sync-dot.warn { background: var(--warn); }
  .sync-dot.error { background: var(--err); }
  .sync-dot.none { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-dim); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  .tb-sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }

  .search-wrap { position: relative; flex-shrink: 0; }
  .search-wrap svg {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    stroke: var(--text-dim); stroke-width: 1.8;
    fill: none; pointer-events: none;
  }
  #search {
    width: 180px; height: 30px;
    padding: 0 30px 0 32px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    border-radius: 7px;
    font-family: inherit; font-size: 13px;
    color: var(--text); outline: none;
    transition: all .15s;
  }
  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
    width: 240px;
  }
  .filter-select {
    height: 30px; padding: 0 26px 0 10px;
    border: 1px solid var(--border);
    background: var(--bg-card); border-radius: 7px;
    font-family: inherit; font-size: 12.5px;
    color: var(--text); cursor: pointer; outline: none;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%2386868b' stroke-width='1.5' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat; background-position: right 8px center;
    flex-shrink: 0;
  }
  .date-jump input[type="date"] {
    height: 30px; padding: 0 10px;
    border: 1px solid var(--border);
    background: var(--bg-card); border-radius: 7px;
    font-family: inherit; font-size: 12.5px;
    color: var(--text); cursor: pointer; outline: none;
  }

  .sync-banner {
    position: absolute; top: 12px; left: 50%;
    transform: translateX(-50%);
    background: var(--bg-modal); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2), 0 0 0 0.5px rgba(0,0,0,.1);
    padding: 10px 12px 10px 16px;
    display: flex; align-items: center; gap: 12px;
    z-index: 50; max-width: calc(100% - 40px);
    font-size: 13px; animation: slideDown .25s ease;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translate(-50%, -8px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
  .sync-banner #bannerText { flex: 1; min-width: 0; }
  .sync-banner #bannerText b { color: var(--accent); font-weight: 600; }
  .sync-banner button {
    border: 0; border-radius: 6px;
    padding: 6px 12px; font-family: inherit;
    font-size: 12.5px; cursor: pointer;
    font-weight: 500; flex-shrink: 0;
  }
  .sync-banner #bannerAction { background: var(--accent); color: #fff; }
  .sync-banner #bannerAction:hover { background: #0066d6; }
  .sync-banner #bannerClose {
    background: transparent; color: var(--text-dim);
    width: 24px; height: 24px; padding: 0;
    font-size: 15px; line-height: 1; border-radius: 5px;
  }
  .sync-banner #bannerClose:hover { background: var(--hover); color: var(--text); }

  .content-wrap {
    flex: 1; overflow: hidden;
    position: relative; display: flex;
    min-height: 0;
  }
  .tab-content { display: none; flex: 1; min-height: 0; overflow: hidden; }
  .tab-content.active { display: flex; }

  /* BOARD */
  .board {
    flex: 1; display: flex; gap: 14px;
    padding: 18px;
    overflow: auto;
    align-items: flex-start;
  }

  .column {
    flex: 0 0 300px; width: 300px;
    background: var(--bg-column);
    backdrop-filter: saturate(180%) blur(16px);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    border-radius: 12px;
    box-shadow: 0 0 0 1px var(--border), 0 1px 3px rgba(0,0,0,.04);
    display: flex; flex-direction: column;
    min-height: 0;
    transition: box-shadow .15s;
  }
  .column.drag-over { box-shadow: 0 0 0 2px var(--accent), 0 1px 3px rgba(0,0,0,.04); }
  .column.wip-full { box-shadow: 0 0 0 1px var(--warn), 0 1px 3px rgba(0,0,0,.04); }
  .column.wip-over { box-shadow: 0 0 0 2px var(--p-high), 0 1px 3px rgba(0,0,0,.04); }

  .column-header {
    padding: 12px 12px 8px;
    display: flex; align-items: center;
    gap: 8px; flex-shrink: 0;
  }
  .col-dot {
    width: 9px; height: 9px; border-radius: 50%;
    flex-shrink: 0; background: var(--accent);
  }
  .col-title {
    font-size: 13px; font-weight: 600;
    color: var(--text); flex: 1;
    background: transparent; border: 0;
    outline: none; font-family: inherit;
    padding: 2px 4px; border-radius: 4px;
    min-width: 0; text-overflow: ellipsis;
    transition: background .12s;
  }
  .col-title:hover { background: var(--hover); }
  .col-title:focus { background: var(--active); }
  .col-count {
    font-size: 11px; font-weight: 600;
    color: var(--text-dim); background: var(--hover);
    padding: 2px 8px; border-radius: 10px;
    flex-shrink: 0; font-variant-numeric: tabular-nums;
  }
  .col-count.wip-full { color: var(--warn); background: rgba(255,149,0,.14); }
  .col-count.wip-over { color: var(--p-high); background: rgba(255,59,48,.14); }
  .col-menu {
    width: 24px; height: 24px;
    border: 0; background: transparent;
    border-radius: 5px; cursor: pointer;
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 15px; line-height: 1;
    transition: all .12s;
  }
  .col-menu:hover { background: var(--hover); color: var(--text); }

  .column-body {
    padding: 4px 10px 10px;
    display: flex; flex-direction: column;
    gap: 8px; min-height: 40px;
  }

  .quick-add { padding: 6px 10px 10px; flex-shrink: 0; }
  .quick-input {
    width: 100%; padding: 8px 10px;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 7px;
    font-family: inherit; font-size: 12.5px;
    color: var(--text); outline: none;
    transition: all .15s;
  }
  .quick-input::placeholder { color: var(--text-dim); }
  .quick-input:hover { background: var(--hover); }
  .quick-input:focus {
    background: var(--bg-card);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  .quick-preview {
    margin-top: 6px;
    display: flex; flex-wrap: wrap; gap: 4px;
    min-height: 0;
  }
  .quick-preview:empty { display: none; }
  .qp-chip {
    font-size: 10.5px; font-weight: 600;
    padding: 2px 7px; border-radius: 5px;
    display: inline-flex; align-items: center; gap: 3px;
  }
  .qp-chip.p-high { background: rgba(255,59,48,.15); color: var(--p-high); }
  .qp-chip.p-medium { background: rgba(255,149,0,.15); color: var(--p-med); }
  .qp-chip.p-low { background: rgba(52,199,89,.15); color: var(--p-low); }
  .qp-chip.tag { background: var(--accent-light); color: var(--accent); }
  .qp-chip.date { background: rgba(94,92,230,.14); color: #5e5ce6; }

  .add-column {
    flex: 0 0 280px; width: 280px;
    padding: 12px 16px;
    background: rgba(255,255,255,.25);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 2px dashed var(--border-strong);
    border-radius: 12px;
    cursor: pointer; font-family: inherit;
    font-size: 13px; color: var(--text-dim);
    display: flex; align-items: center;
    justify-content: center; gap: 8px;
    transition: all .15s;
    align-self: flex-start;
  }
  [data-theme="dark"] .add-column { background: rgba(44,44,46,.3); }
  .add-column:hover {
    background: rgba(255,255,255,.5);
    color: var(--text); border-color: var(--accent);
  }
  [data-theme="dark"] .add-column:hover { background: rgba(44,44,46,.6); }
  .add-column svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }

  /* CARD */
  .card {
    background: var(--bg-card);
    border-radius: 9px;
    padding: 10px 12px;
    box-shadow: var(--shadow-card);
    cursor: grab;
    transition: box-shadow .15s, transform .12s;
    position: relative;
    user-select: none;
    display: flex; flex-direction: column;
    gap: 8px; overflow: hidden;
  }
  .card:hover { box-shadow: var(--shadow-card-hover); }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .35; transform: scale(.98); }
  .touch-drag-ghost {
    position: fixed; z-index: 9999; pointer-events: none;
    opacity: .92; transform: scale(1.04) rotate(1.5deg);
    box-shadow: 0 12px 28px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.06);
    transition: none; margin: 0;
  }
  .card.pomo-running { box-shadow: 0 0 0 2px var(--p-high), 0 4px 12px rgba(255,59,48,.15); }
  .card.all-done { background: linear-gradient(180deg, rgba(52,199,89,.05), transparent 60%); }

  .card-img {
    width: calc(100% + 24px); margin: -10px -12px 0;
    height: 150px; object-fit: cover; display: block;
    cursor: zoom-in; background: var(--hover);
    transition: opacity .15s;
  }
  .card-img:hover { opacity: .92; }

  .card-head { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .card-prio {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0; margin-top: 5px;
  }
  .card-prio.high { background: var(--p-high); }
  .card-prio.medium { background: var(--p-med); }
  .card-prio.low { background: var(--p-low); }
  .card-prio.none { background: var(--border-strong); }

  .card-status {
    display: inline-flex; align-items: center;
    gap: 5px;
    font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
    line-height: 1.5;
    margin-top: 1px;
    letter-spacing: .2px;
    text-transform: uppercase;
  }
  .card-status::before {
    content: ''; width: 5px; height: 5px;
    border-radius: 50%; background: currentColor;
    flex-shrink: 0;
  }

  .card-title {
    font-size: 13.5px; font-weight: 500;
    color: var(--text); line-height: 1.4;
    word-break: break-word; flex: 1; min-width: 0;
    flex-basis: 100%;
  }
  .card-title mark {
    background: rgba(255,204,0,.5); color: inherit;
    padding: 0 1px; border-radius: 2px;
  }

  .card-desc {
    font-size: 12.5px; color: var(--text-dim);
    line-height: 1.45; word-break: break-word;
    white-space: pre-wrap;
  }

  .card-checklist {
    display: flex; flex-direction: column; gap: 6px;
    padding: 6px 0 2px;
    border-top: 1px solid var(--border);
  }
  .checklist-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--text-dim);
  }
  .checklist-head .label {
    font-weight: 600; font-variant-numeric: tabular-nums;
    min-width: 30px;
  }
  .checklist-bar {
    flex: 1; height: 4px; background: var(--hover);
    border-radius: 2px; overflow: hidden;
  }
  .checklist-fill {
    height: 100%; background: var(--accent);
    transition: width .3s ease;
  }
  .card.all-done .checklist-fill { background: var(--ok); }
  .checklist-items {
    display: flex; flex-direction: column; gap: 3px;
  }
  .check-item {
    display: flex; align-items: flex-start; gap: 7px;
    font-size: 12px; color: var(--text-soft);
    line-height: 1.4; cursor: pointer;
    padding: 2px 0;
  }
  .check-item input {
    appearance: none;
    width: 14px; height: 14px;
    border: 1.5px solid var(--border-strong);
    border-radius: 4px;
    flex-shrink: 0; margin-top: 1px;
    cursor: pointer;
    position: relative;
    transition: all .12s;
    background: transparent;
  }
  .check-item input:hover { border-color: var(--accent); }
  .check-item input:checked {
    background: var(--accent); border-color: var(--accent);
  }
  .check-item input:checked::after {
    content: '';
    position: absolute;
    left: 3px; top: 0px;
    width: 4px; height: 8px;
    border: solid #fff; border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
  }
  .check-item span { flex: 1; min-width: 0; word-break: break-word; }
  .check-item.done span { text-decoration: line-through; color: var(--text-dim); opacity: .7; }

  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    font-size: 10.5px; font-weight: 500;
    padding: 2px 7px; border-radius: 5px;
    background: var(--accent-light); color: var(--accent);
    white-space: nowrap;
  }
  .card-foot {
    display: flex; align-items: center;
    justify-content: space-between; gap: 8px;
    font-size: 11px; color: var(--text-dim);
  }
  .card-foot-left {
    display: flex; align-items: center;

  }
  .card-due {

    gap: 4px; font-weight: 500;
    white-space: nowrap;
  }
  .card-due svg { width: 11px; height: 11px; stroke: currentColor; stroke-width: 1.8; fill: none; }
  .card-due.soon { color: var(--p-med); }
  .card-due.overdue { color: var(--p-high); }

  .card-meta {
    display: inline-flex; align-items: center;
    gap: 4px; font-weight: 500;
    white-space: nowrap;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-meta svg {
    width: 11px; height: 11px;
    stroke: currentColor; stroke-width: 1.8;
    fill: none; flex-shrink: 0;
  }
  .card-from { color: var(--text-dim); }
  .card-taskdate { color: var(--text-dim); }

  .card-pomo {
    display: inline-flex; align-items: center;
    gap: 4px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

    color: var(--p-high);

  }

  .card-actions {
    position: absolute; top: 8px; right: 8px;

  }
  .card:hover .card-actions { opacity: 1; }
  .card-menu-btn, .card-pomo-btn {
    width: 22px; height: 22px;
    border: 0; background: var(--bg-card);
    border-radius: 5px; cursor: pointer;
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; padding: 0;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
    transition: all .12s;
  }
  .card-menu-btn:hover, .card-pomo-btn:hover { background: var(--hover); color: var(--text); }
  .card-pomo-btn.running { background: var(--p-high); color: #fff; }

  .drop-placeholder {
    height: 60px;
    border: 2px dashed var(--accent);
    border-radius: 9px;
    background: var(--accent-light);
    margin: 0; flex-shrink: 0;
  }
  .column-body:empty::before {
    content: 'Перетащи карточку сюда';
    display: block; text-align: center;
    padding: 20px 8px; font-size: 12px;
    color: var(--text-dim); opacity: .7;
  }
  .column-body.only-placeholder::before { display: none; }

  /* ============================================================
     КАРТА ЗАДАЧ
     ============================================================ */
  .map-view {
    flex: 1; position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 45%, rgba(0, 122, 255, 0.05), transparent 55%),
      radial-gradient(circle at 25% 75%, rgba(175, 82, 222, 0.03), transparent 55%),
      radial-gradient(circle at 80% 25%, rgba(52, 199, 89, 0.03), transparent 55%);
    transition: background .3s;
  }
  [data-theme="dark"] .map-view {
    background:
      radial-gradient(circle at 50% 45%, rgba(74, 144, 226, 0.08), transparent 55%),
      radial-gradient(circle at 25% 75%, rgba(175, 82, 222, 0.06), transparent 55%),
      radial-gradient(circle at 80% 25%, rgba(52, 199, 89, 0.05), transparent 55%);
  }
  #mapCanvas {
    position: absolute;
    inset: 0;
    display: block;
    cursor: default;
  }
  .map-controls {
    position: absolute;
    top: 16px; right: 16px;
    z-index: 5;
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--bg-toolbar);
    backdrop-filter: saturate(180%) blur(16px);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 6px 4px 4px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .map-controls .segmented.small {
    background: var(--hover);
  }
  #mapTooltip {
    position: absolute;
    pointer-events: none;
    background: var(--bg-modal);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 12px;
    font-size: 12px;
    box-shadow: 0 8px 26px rgba(0,0,0,.18);
    z-index: 20;
    max-width: 280px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .12s ease, transform .12s ease;
  }
  #mapTooltip.show {
    opacity: 1;
    transform: translateY(0);
  }
  #mapTooltip .tt-title {
    font-weight: 600;
    color: var(--text);
    margin-bottom: 5px;
    line-height: 1.35;
    word-break: break-word;
    font-size: 12.5px;
  }
  #mapTooltip .tt-meta {
    color: var(--text-dim);
    font-size: 11px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  #mapTooltip .tt-meta span {
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .map-empty {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: var(--text-dim);
    font-size: 13px;
    pointer-events: none;
    text-align: center;
    padding: 40px;
  }
  .map-empty svg {
    width: 48px; height: 48px;
    stroke: var(--text-dim);
    stroke-width: 1.4;
    fill: none;
    opacity: .5;
  }

  /* STATS */
  .stats-view {
    flex: 1; overflow-y: auto;
    padding: 22px 26px 60px;
  }
  .stats-inner {
    max-width: 1000px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 20px;
  }
  .stats-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }
  .stat-card {
    background: var(--bg-card);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 0 0 1px var(--border), 0 1px 3px rgba(0,0,0,.04);
  }
  [data-theme="dark"] .stat-card { background: rgba(44,44,46,.5); }
  .stat-card h4 {
    font-size: 11px; font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 8px;
  }
  .stat-big {
    font-size: 32px; font-weight: 700;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .stat-big.accent { color: var(--accent); }
  .stat-big.danger { color: var(--p-high); }
  .stat-big.warn { color: var(--warn); }
  .stat-big.ok { color: var(--ok); }
  .stat-sub {
    font-size: 12px; color: var(--text-dim);
    margin-top: 4px;
  }

  .stats-panel {
    background: var(--bg-card);
    border-radius: 12px;
    padding: 20px 22px;
    box-shadow: 0 0 0 1px var(--border), 0 1px 3px rgba(0,0,0,.04);
  }
  [data-theme="dark"] .stats-panel { background: rgba(44,44,46,.5); }
  .stats-panel h3 {
    font-size: 14px; font-weight: 600;
    margin-bottom: 16px;
  }

  .bar-chart { display: flex; flex-direction: column; gap: 10px; }
  .bar-row {
    display: flex; align-items: center;
    gap: 12px; font-size: 12.5px;
  }
  .bar-label {
    width: 130px; flex-shrink: 0;
    display: flex; align-items: center; gap: 6px;
    color: var(--text);
    font-weight: 500;
    overflow: hidden;
  }
  .bar-label .col-dot { width: 8px; height: 8px; }
  .bar-track {
    flex: 1; height: 22px;
    background: var(--hover);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%; border-radius: 6px;
    background: var(--accent);
    transition: width .4s ease;
    min-width: 4px;
  }
  .bar-count {
    width: 40px; flex-shrink: 0;
    text-align: right; font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .priority-chart {
    display: flex; align-items: center;
    gap: 30px; flex-wrap: wrap;
  }
  .donut-wrap {
    position: relative;
    width: 140px; height: 140px;
    flex-shrink: 0;
  }
  .donut {
    width: 100%; height: 100%;
    border-radius: 50%;
    transition: background .4s ease;
  }
  .donut-hole {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 70%; height: 70%;
    background: var(--bg-card);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  [data-theme="dark"] .donut-hole { background: #2c2c2e; }
  .donut-hole .total {
    font-size: 24px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .donut-hole .lbl {
    font-size: 10px; color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-top: 2px;
  }
  .legend { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 180px; }
  .legend-item {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px;
  }
  .legend-color {
    width: 12px; height: 12px;
    border-radius: 3px; flex-shrink: 0;
  }
  .legend-label { flex: 1; color: var(--text); }
  .legend-count {
    font-weight: 600; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .overdue-list { display: flex; flex-direction: column; gap: 6px; }
  .overdue-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    background: var(--hover);
    border-radius: 8px;
    cursor: pointer;
    transition: background .12s;
    font-size: 13px;
    border: 0;
    font-family: inherit;
    color: var(--text);
    text-align: left;
    width: 100%;
  }
  .overdue-item:hover { background: var(--active); }
  .overdue-item .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .overdue-item .days {
    font-size: 11.5px; font-weight: 600;
    color: var(--p-high); flex-shrink: 0;
  }
  .stats-empty {
    text-align: center; padding: 30px;
    color: var(--text-dim); font-size: 13px;
  }

  /* TEMPLATES / CHECKS / STATUSES / MISC (сжато — те же стили что были) */
  .tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .tpl-card {
    padding: 14px; border: 1px solid var(--border-strong);
    background: transparent; border-radius: 10px;
    cursor: pointer; font-family: inherit; text-align: left;
    transition: all .12s; position: relative;
  }
  .tpl-card:hover { background: var(--hover); border-color: var(--accent); }
  .tpl-card h5 {
    font-size: 13px; font-weight: 600; color: var(--text);
    margin-bottom: 4px; display: flex; align-items: center; gap: 6px;
  }
  .tpl-card p {
    font-size: 11.5px; color: var(--text-dim); line-height: 1.4;
    overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .tpl-card .tpl-del {
    position: absolute; top: 8px; right: 8px;
    width: 22px; height: 22px;
    border: 0; background: transparent;
    border-radius: 5px; cursor: pointer;
    color: var(--text-dim); font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: all .12s;
  }
  .tpl-card:hover .tpl-del { opacity: 1; }
  .tpl-card .tpl-del:hover { background: rgba(255,59,48,.15); color: var(--p-high); }
  .tpl-new {
    border-style: dashed; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px; min-height: 90px; color: var(--text-dim);
  }
  .tpl-new svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; }

  .cl-editor { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .cl-edit-item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; border-radius: 6px;
    transition: background .12s;
  }
  .cl-edit-item:hover { background: var(--hover); }
  .cl-edit-item .drag-handle {
    cursor: grab; color: var(--text-dim);
    font-size: 12px; user-select: none; padding: 0 2px;
  }
  .cl-edit-item .drag-handle:active { cursor: grabbing; }
  .cl-edit-item.cl-dragging { opacity: .35; }
  .cl-edit-item.cl-drop-above { box-shadow: inset 0 2px 0 var(--accent); }
  .cl-edit-item.cl-drop-below { box-shadow: inset 0 -2px 0 var(--accent); }
  .cl-edit-item input[type="checkbox"] {
    appearance: none; width: 16px; height: 16px;
    border: 1.5px solid var(--border-strong);
    border-radius: 4px; flex-shrink: 0;
    cursor: pointer; position: relative; background: transparent;
  }
  .cl-edit-item input[type="checkbox"]:checked {
    background: var(--accent); border-color: var(--accent);
  }
  .cl-edit-item input[type="checkbox"]:checked::after {
    content: ''; position: absolute;
    left: 4px; top: 1px; width: 4px; height: 8px;
    border: solid #fff; border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
  }
  .cl-edit-item input[type="text"] {
    flex: 1; border: 0; outline: none;
    background: transparent; color: var(--text);
    font-family: inherit; font-size: 13px; padding: 2px 4px;
  }
  .cl-edit-item input[type="text"]:focus { background: var(--bg-window); border-radius: 4px; }
  .cl-edit-item .rm {
    width: 22px; height: 22px; border: 0; background: transparent;
    color: var(--text-dim); cursor: pointer;
    border-radius: 4px; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: all .12s;
  }
  .cl-edit-item:hover .rm { opacity: 1; }
  .cl-edit-item .rm:hover { background: rgba(255,59,48,.15); color: var(--p-high); }
  .cl-add-btn {
    margin-top: 4px; padding: 7px 10px;
    border: 1px dashed var(--border-strong);
    background: transparent; border-radius: 7px;
    cursor: pointer; font-family: inherit; font-size: 12.5px;
    color: var(--text-dim); display: flex; align-items: center; gap: 6px;
    transition: all .12s;
  }
  .cl-add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .cl-progress-top {
    display: flex; align-items: center; gap: 10px;
    margin-top: 10px; font-size: 12px; color: var(--text-dim);
  }
  .cl-progress-top .bar {
    flex: 1; height: 6px; background: var(--hover);
    border-radius: 3px; overflow: hidden;
  }
  .cl-progress-top .fill {
    height: 100%; background: var(--accent);
    transition: width .3s ease;
  }

  .status-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .status-opt {
    padding: 8px 12px;
    border: 1.5px solid var(--border-strong);
    background: transparent; border-radius: 8px;
    cursor: pointer; font-family: inherit;
    font-size: 12.5px; color: var(--text);
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .12s; font-weight: 500;
  }
  .status-opt:hover { background: var(--hover); }
  .status-opt .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .status-opt.on { font-weight: 700; }

  /* DIARY */
  .diary-wrap { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  .diary-sidebar {
    width: 260px; flex: 0 0 260px;
    background: var(--bg-diary-sidebar);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto; padding: 8px; gap: 2px;
  }
  .diary-sidebar-title {
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .5px;
    padding: 10px 12px 6px;
  }
  .diary-item {
    padding: 8px 10px; border-radius: 8px;

  .diary-item-date .day {
    font-size: 18px; font-weight: 700; color: var(--text);

  }

  .diary-item-title {

  .diary-item-preview {

  }
  .diary-item-preview svg {
    width: 11px; height: 11px;
    stroke: currentColor; stroke-width: 1.8;
    fill: none; flex-shrink: 0;
  }
  .diary-item-thumb {
    width: 34px; height: 34px; border-radius: 6px;
    object-fit: cover; flex-shrink: 0; background: var(--hover);
  }
  .diary-empty-sidebar {
    padding: 20px 12px; text-align: center;
    font-size: 12px; color: var(--text-dim); line-height: 1.5;
  }
  .diary-main {
    flex: 1; overflow-y: auto;
    display: flex; justify-content: center;
    padding: 26px 32px 60px;
  }
  .diary-inner {
    width: 100%; max-width: 700px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .diary-header {
    display: flex; align-items: flex-end;
    justify-content: space-between; gap: 16px;
  }
  .diary-date-big {
    font-size: 30px; font-weight: 700;
    letter-spacing: -.5px; line-height: 1.1; color: var(--text);
  }
  .diary-weekday {
    font-size: 13px; color: var(--text-dim);
    font-weight: 500; margin-top: 4px; text-transform: capitalize;
  }
  .diary-today-badge {
    background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 10px;
    flex-shrink: 0; margin-bottom: 4px;
  }
  .diary-filter { display:flex; flex-direction:column; gap:6px; padding:0 0 10px; }
  .diary-filter input, .diary-filter select { width:100%; font:inherit; font-size:12.5px; padding:6px 8px; border-radius:7px; border:1px solid var(--border-strong); background:var(--bg-card); color:var(--text); outline:none; }
  .diary-filter .row { display:flex; gap:6px; }
  .diary-fmt { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
  .diary-fmt button { font:inherit; font-size:12.5px; padding:4px 9px; border-radius:7px; border:1px solid var(--border); background:var(--bg-card); color:var(--text-soft); cursor:pointer; }
  .diary-fmt button:hover { background:var(--hover); }
  .diary-fmt button.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .sum-bar { display:flex; align-items:center; gap:8px; font-size:13px; margin:5px 0; }
  .sum-bar i { display:block; height:10px; border-radius:6px; min-width:4px; background:linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #fff)); }
  .diary-fmt { padding:4px; gap:2px; margin:10px 0; border:1px solid var(--border); border-radius:12px; background:var(--bg-card); }
  .diary-fmt button { border:0; background:transparent; padding:6px 11px; border-radius:8px; }
  .diary-fmt button.on { background:var(--accent); color:#fff; }
  .diary-fmt .pv-toggle { margin-left:auto; }
  .diary-filter input, .diary-filter select { border-radius:10px; padding:8px 11px; transition:border-color .15s, box-shadow .15s; }
  .diary-filter input:focus, .diary-filter select:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .diary-preview { min-height:300px; padding:6px 2px; font-size:15px; line-height:1.7; color:var(--text); }
  .diary-preview h3 { font-size:18px; font-weight:650; letter-spacing:-.2px; margin:18px 0 6px; }
  .diary-preview p { margin:2px 0; }
  .diary-preview .pv-gap { height:10px; }
  .diary-preview blockquote { margin:8px 0; padding:4px 14px; border-left:3px solid var(--accent); color:var(--text-soft); background:color-mix(in srgb, var(--accent) 6%, transparent); border-radius:0 8px 8px 0; }
  .diary-preview .pv-list { list-style:none; margin:4px 0; padding:0; }

  .diary-preview .pv-bullet::before { content:''; flex:none; width:6px; height:6px; margin:11px 6px 0 4px; border-radius:50%; background:var(--accent); }

  .modal-bg {

  .lightbox {

  /* ============================================================
     LIQUID GLASS
     ============================================================ */
  :root {
    --lg-spring: cubic-bezier(.34, 1.56, .64, 1);
    --lg-ease: cubic-bezier(.22, 1, .36, 1);
    --lg-blur: blur(26px) saturate(190%) brightness(1.04);
    --lg-fill: rgba(255,255,255,.30);
    --lg-fill-strong: rgba(255,255,255,.52);
    --lg-fill-card: rgba(255,255,255,.64);
    --lg-rim: rgba(255,255,255,.70);
    --lg-sheen: linear-gradient(135deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.06) 42%, rgba(255,255,255,.04) 60%, rgba(255,255,255,.26) 100%);
    --lg-spec: inset 1px 1px 0 rgba(255,255,255,.85), inset -1px -1px 0 rgba(255,255,255,.28), inset 0 0 18px rgba(255,255,255,.16);
    --lg-shadow: 0 12px 34px rgba(48,60,130,.16), 0 2px 6px rgba(48,60,130,.08);
    --lg-glow: rgba(255,255,255,0);
    --bg-toolbar: var(--lg-fill-strong);
    --bg-column: var(--lg-fill);
    --bg-card: var(--lg-fill-card);
    --bg-modal: rgba(255,255,255,.74);
    --bg-diary-sidebar: var(--lg-fill);
    --border: rgba(255,255,255,.45);
    --hover: rgba(255,255,255,.38);
    --active: rgba(255,255,255,.55);
    --accent-light: rgba(0,122,255,.16);
    --shadow-card: var(--lg-spec), 0 4px 14px rgba(48,60,130,.10);
    --shadow-card-hover: var(--lg-spec), 0 12px 28px rgba(48,60,130,.18);
  }
  [data-theme="dark"] {
    --lg-blur: blur(30px) saturate(170%) brightness(1.1);
    --lg-fill: rgba(255,255,255,.07);
    --lg-fill-strong: rgba(40,42,60,.45);
    --lg-fill-card: rgba(26,28,46,.56);
    --lg-rim: rgba(255,255,255,.26);
    --lg-sheen: linear-gradient(135deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,.02) 42%, rgba(255,255,255,.01) 60%, rgba(255,255,255,.06) 100%);
    --text-dim: #a9a9b3;
    --text-soft: #d0d0d8;
    --lg-spec: inset 1px 1px 0 rgba(255,255,255,.30), inset -1px -1px 0 rgba(255,255,255,.07), inset 0 0 16px rgba(255,255,255,.04);
    --lg-shadow: 0 14px 38px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    --bg-modal: rgba(40,42,58,.72);
    --border: rgba(255,255,255,.12);
    --hover: rgba(255,255,255,.09);
    --active: rgba(255,255,255,.16);
    --shadow-card: var(--lg-spec), 0 4px 14px rgba(0,0,0,.3);
    --shadow-card-hover: var(--lg-spec), 0 12px 28px rgba(0,0,0,.45);
  }

  /* Минималистичный фон */
  :root { --win-bg: #f3f4f7; --body-bg: #e7e9ee; }
  [data-theme="dark"] { --win-bg: #16171a; --body-bg: #0e0f12; }
  body { background: var(--body-bg); }
  .window { background: var(--win-bg); }
  .map-view, [data-theme="dark"] .map-view { background: transparent; }

  /* Панели: тулбар, заголовок, статус-бар */
  .titlebar, .toolbar, .statusbar {
    background: var(--lg-sheen), var(--lg-fill-strong);
    -webkit-backdrop-filter: var(--lg-blur); backdrop-filter: var(--lg-blur);
  }
  .titlebar { box-shadow: inset 0 -1px 0 var(--lg-rim); border-bottom-color: transparent; }
  .toolbar { box-shadow: inset 0 -1px 0 var(--lg-rim), inset 0 1px 0 rgba(255,255,255,.35); border-bottom-color: transparent; }
  .statusbar { box-shadow: inset 0 1px 0 var(--lg-rim); border-top-color: transparent; }

  /* Колонки */
  .column {
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), var(--lg-glow), transparent 70%), var(--lg-sheen), var(--lg-fill);
    -webkit-backdrop-filter: var(--lg-blur); backdrop-filter: var(--lg-blur);
    border-radius: 20px;
    box-shadow: var(--lg-spec), var(--lg-shadow);
    transition: box-shadow .25s var(--lg-ease), transform .25s var(--lg-spring);
  }
  .column:hover { --lg-glow: rgba(255,255,255,.22); }
  [data-theme="dark"] .column:hover { --lg-glow: rgba(255,255,255,.07); }
  .column.drag-over { box-shadow: var(--lg-spec), 0 0 0 2px var(--accent), 0 0 32px rgba(0,122,255,.35); }
  .column.wip-full { box-shadow: var(--lg-spec), 0 0 0 1.5px var(--warn), var(--lg-shadow); }
  .column.wip-over { box-shadow: var(--lg-spec), 0 0 0 2px var(--p-high), var(--lg-shadow); }
  .add-column { border-radius: 20px; background: var(--lg-fill); box-shadow: var(--lg-spec); border-color: var(--lg-rim); }
  [data-theme="dark"] .add-column, [data-theme="dark"] .add-column:hover { background: var(--lg-fill); }
  .add-column:hover { background: var(--lg-fill-strong); }
  [data-theme="dark"] .add-column { color: var(--text-soft); }

  /* Карточки (без backdrop-filter — их может быть много) */
  .card {
    background: radial-gradient(200px circle at var(--mx, 50%) var(--my, 0%), var(--lg-glow), transparent 70%), var(--lg-sheen), var(--lg-fill-card);
    border-radius: 15px;
    transition: box-shadow .25s var(--lg-ease), transform .35s var(--lg-spring);
  }
  .card:hover { --lg-glow: rgba(255,255,255,.55); transform: translateY(-2px) scale(1.012); }
  [data-theme="dark"] .card:hover { --lg-glow: rgba(255,255,255,.12); }
  .card:active { transform: scale(.985); }
  .card.dragging { transform: scale(.97) rotate(-1deg); }
  .card.all-done { background: linear-gradient(180deg, rgba(52,199,89,.16), transparent 65%), var(--lg-sheen), var(--lg-fill-card); }
  .touch-drag-ghost { box-shadow: var(--lg-spec), 0 18px 40px rgba(20,30,90,.35); border-radius: 15px; }
  .drop-placeholder { border-radius: 14px; background: var(--accent-light); border: 1.5px dashed var(--accent); }

  /* Сегментированные переключатели — скользящая стеклянная «линза» */
  .segmented {
    position: relative; border-radius: 999px; padding: 3px;
    background: var(--lg-fill);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.08), inset 0 0 0 1px var(--lg-rim);
    -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%);
  }
  .seg-btn { position: relative; z-index: 1; border-radius: 999px; transition: color .2s, transform .3s var(--lg-spring); }
  .seg-btn:active { transform: scale(.94); }
  .seg-btn.active { background: var(--lg-fill-strong); box-shadow: var(--lg-spec), 0 3px 10px rgba(48,60,130,.18); }
  .segmented.lg-ready .seg-btn.active { background: transparent; box-shadow: none; }
  .lg-thumb {
    position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 999px;
    background: var(--lg-sheen), var(--lg-fill-strong);
    box-shadow: var(--lg-spec), 0 4px 12px rgba(48,60,130,.22);
    transition: transform .5s var(--lg-spring), width .5s var(--lg-spring);
    pointer-events: none;
  }
  .lg-thumb.moving { animation: lgStretch .5s var(--lg-ease); }
  @keyframes lgStretch { 40% { scale: 1.12 .9; } 100% { scale: 1 1; } }
  .segmented.small { padding: 2px; }
  .segmented.small .lg-thumb { top: 2px; bottom: 2px; }

  /* Кнопки и поля */
  .tbtn { border-radius: 999px; transition: background .2s, transform .3s var(--lg-spring), box-shadow .2s; }
  .tbtn:hover { background: var(--lg-fill-strong); box-shadow: var(--lg-spec); }
  .tbtn:active { transform: scale(.94); }
  .tbtn.primary {
    background: linear-gradient(180deg, rgba(90,170,255,.95), rgba(0,110,240,.92));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,0,0,.12), 0 6px 16px rgba(0,122,255,.38);
  }
  .tbtn.primary:hover { background: linear-gradient(180deg, rgba(110,180,255,1), rgba(10,120,250,.96)); }
  .icon-btn { border-radius: 999px; }
  .filter-select, .date-jump input[type="date"], #search {
    background-color: var(--lg-fill); border: 1px solid var(--lg-rim); border-radius: 999px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.06), inset 0 0 8px rgba(255,255,255,.12);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .filter-select:focus, #search:focus { box-shadow: 0 0 0 3px var(--accent-light), inset 0 1px 2px rgba(0,0,0,.06); }

  /* Всплывающие поверхности */
  .modal-bg { background: rgba(20,24,50,.28); -webkit-backdrop-filter: blur(12px) saturate(140%); backdrop-filter: blur(12px) saturate(140%); }
  .modal, .popup, .confirm-overlay .confirm-box, .sync-banner {
    background: var(--lg-sheen), var(--bg-modal);
    -webkit-backdrop-filter: var(--lg-blur); backdrop-filter: var(--lg-blur);
    box-shadow: var(--lg-spec), 0 24px 70px rgba(20,30,90,.35);
    border-radius: 24px;
  }
  .popup { border-radius: 18px; }
  .sync-banner { border-radius: 18px; }
  .modal, .popup { animation: lgPop .45s var(--lg-spring); }
  @keyframes lgPop { from { transform: scale(.9) translateY(10px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
  .popup-item { border-radius: 10px; }
  .modal input[type="text"], .modal textarea, .modal select, .modal input[type="date"], .modal input[type="number"] {
    background: var(--lg-fill); border: 1px solid var(--lg-rim); border-radius: 12px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.06);
  }
  .toast {
    background: var(--lg-sheen), rgba(30,32,48,.55);
    -webkit-backdrop-filter: var(--lg-blur); backdrop-filter: var(--lg-blur);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.35), inset -1px -1px 0 rgba(255,255,255,.1), 0 12px 30px rgba(0,0,0,.35);
    border-radius: 999px; transition: opacity .35s, transform .5s var(--lg-spring);
  }

  /* Карта, обзор, шаблоны, дневник */
  .map-controls {
    background: var(--lg-sheen), var(--lg-fill-strong);
    -webkit-backdrop-filter: var(--lg-blur); backdrop-filter: var(--lg-blur);
    border: 0; border-radius: 999px; box-shadow: var(--lg-spec), var(--lg-shadow);
  }
  #mapTooltip {
    background: var(--lg-sheen), var(--bg-modal);
    -webkit-backdrop-filter: var(--lg-blur); backdrop-filter: var(--lg-blur);
    border: 0; border-radius: 16px; box-shadow: var(--lg-spec), 0 16px 40px rgba(20,30,90,.28);
  }
  .stat-card, .stats-panel, .tpl-card, .diary-day-tasks {
    background: var(--lg-sheen), var(--lg-fill);
    -webkit-backdrop-filter: var(--lg-blur); backdrop-filter: var(--lg-blur);
    border: 0; border-radius: 18px; box-shadow: var(--lg-spec), var(--lg-shadow);
  }
  [data-theme="dark"] .stat-card, [data-theme="dark"] .stats-panel, [data-theme="dark"] .diary-day-tasks { background: var(--lg-sheen), var(--lg-fill); }
  .tpl-card { transition: transform .35s var(--lg-spring), box-shadow .25s; }
  .tpl-card:hover { transform: translateY(-2px); background: var(--lg-sheen), var(--lg-fill-strong); }
  .diary-sidebar {
    background: var(--lg-sheen), var(--lg-fill);
    -webkit-backdrop-filter: var(--lg-blur); backdrop-filter: var(--lg-blur);
    box-shadow: inset -1px 0 0 var(--lg-rim);
  }

  /* Без прозрачности/движения — по системным настройкам */
  @media (prefers-reduced-motion: reduce) {
    .window::before { animation: none; }
    .lg-thumb, .card, .column, .tbtn, .seg-btn { transition: none !important; }
    .modal, .popup { animation: none; }
  }
  @media (prefers-reduced-transparency: reduce) {

    [data-theme="dark"] { --lg-fill: rgba(44,44,48,.92); --lg-fill-strong: rgba(48,48,52,.96); --lg-fill-card: rgba(58,58,62,.96); --bg-modal: rgba(44,44,48,.98); }
    * { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root { --lg-fill: rgba(255,255,255,.8); --lg-fill-strong: rgba(255,255,255,.9); --lg-fill-card: rgba(255,255,255,.92); --bg-modal: rgba(255,255,255,.97); }
    [data-theme="dark"] { --lg-fill: rgba(44,44,48,.9); --lg-fill-strong: rgba(48,48,52,.94); --lg-fill-card: rgba(58,58,62,.95); --bg-modal: rgba(44,44,48,.97); }
  }

  @media (max-width: 700px) {
    .sync-banner { left: 12px; right: 12px; width: auto; max-width: none; transform: none; animation: none; flex-wrap: wrap; }
  }

  /* Имя пользователя */
  .user-chip {
    height: 28px; padding: 0 12px 0 4px; border: 0; background: transparent;
    border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
    font-family: inherit; font-size: 12.5px; font-weight: 500; color: var(--text);
    transition: background .15s; margin-right: 4px; max-width: 180px;
  }
  .user-chip:hover { background: var(--hover); }
  .user-chip.empty .user-name { color: var(--text-dim); }
  .user-avatar {
    width: 22px; height: 22px; border-radius: 50%; flex: 0 0 22px;
    display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #5aa9ff, #7a5cff); color: #fff;

  @media (max-width: 700px) { .user-name { display: none; } .user-chip { padding: 0 4px; } }

  /* Минимализм: спокойные плоские поверхности */
  :root {
    --lg-sheen: linear-gradient(transparent, transparent);
    --lg-fill: rgba(20,24,40,.045);
    --lg-fill-strong: rgba(255,255,255,.74);
    --lg-fill-card: rgba(255,255,255,.96);
    --lg-shadow: 0 1px 2px rgba(20,24,40,.06);
    --lg-blur: blur(18px) saturate(160%);
  }
  [data-theme="dark"] {
    --lg-sheen: linear-gradient(transparent, transparent);
    --lg-fill: rgba(255,255,255,.04);
    --lg-fill-strong: rgba(28,29,33,.78);
    --lg-fill-card: rgba(40,41,47,.96);
    --lg-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  .column:hover { --lg-glow: rgba(0,122,255,.07); }
  .card:hover { --lg-glow: rgba(0,122,255,.14); }
  [data-theme="dark"] .column:hover { --lg-glow: rgba(130,170,255,.09); }
  [data-theme="dark"] .card:hover { --lg-glow: rgba(130,170,255,.22); }
  .card:hover { transform: translateY(-1px); }

  /* Скроллбары */
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(100,106,125,.30); background-clip: content-box;
    border: 3px solid transparent; border-radius: 999px; min-height: 44px; min-width: 44px;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(100,106,125,.55); background-clip: content-box; }
  ::-webkit-scrollbar-thumb:active { background: rgba(0,122,255,.75); background-clip: content-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  [data-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(200,205,225,.26); background-clip: content-box; }
  [data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: rgba(200,205,225,.5); background-clip: content-box; }
  @supports (-moz-appearance: none) {
    * { scrollbar-width: thin; scrollbar-color: rgba(100,106,125,.45) transparent; }
    .toolbar { scrollbar-width: none; }
  }

  /* Фоны на выбор */
  [data-bg="aurora"] { --win-bg: radial-gradient(60% 55% at 12% 8%, rgba(120,170,255,.55), transparent 70%), radial-gradient(55% 50% at 92% 12%, rgba(200,150,255,.45), transparent 70%), radial-gradient(60% 60% at 80% 95%, rgba(110,225,200,.45), transparent 70%), radial-gradient(50% 50% at 8% 92%, rgba(255,190,210,.40), transparent 70%), #f2f4fa; --body-bg: linear-gradient(135deg,#c9d6f0,#ddd0ee,#cfe8e6); }
  [data-theme="dark"][data-bg="aurora"], [data-theme="dark"] [data-bg="aurora"] { --win-bg: radial-gradient(60% 55% at 12% 8%, rgba(60,100,255,.45), transparent 70%), radial-gradient(55% 50% at 92% 12%, rgba(160,70,230,.38), transparent 70%), radial-gradient(60% 60% at 80% 95%, rgba(20,170,160,.36), transparent 70%), radial-gradient(50% 50% at 8% 92%, rgba(220,60,150,.28), transparent 70%), #0d0e18; --body-bg: linear-gradient(135deg,#0b0c14,#150f22,#0a1618); }
  [data-bg="sunset"] { --win-bg: radial-gradient(60% 55% at 12% 8%, rgba(255,170,120,.55), transparent 70%), radial-gradient(55% 50% at 92% 12%, rgba(255,120,160,.42), transparent 70%), radial-gradient(60% 60% at 80% 95%, rgba(170,140,255,.40), transparent 70%), radial-gradient(50% 50% at 8% 92%, rgba(255,210,120,.38), transparent 70%), #fbf3f1; --body-bg: linear-gradient(135deg,#f3d3c4,#f0cfdc,#dcd0f0); }

  /* Окно питомцев */
  .pet-win { position: absolute; z-index: 50; width: 300px; display: none; border-radius: 18px; overflow: hidden;
    background: var(--lg-fill-strong); -webkit-backdrop-filter: var(--lg-blur); backdrop-filter: var(--lg-blur);
    box-shadow: var(--lg-spec), 0 14px 40px rgba(20,30,90,.22); }
  .pet-win.open { display: block; animation: lgPop .3s var(--lg-spring); }
  .pet-win.moving { box-shadow: var(--lg-spec), 0 22px 54px rgba(20,30,90,.34); }
  .pet-win-bar { display: flex; align-items: center; gap: 4px; height: 30px; padding: 0 8px 0 12px; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
    font-size: 12px; font-weight: 600; color: var(--text-dim); }
  .pet-win.moving .pet-win-bar { cursor: grabbing; }
  .pw-sp { flex: 1; }
  .pet-win-bar button { width: 22px; height: 22px; border: 0; border-radius: 50%; background: transparent; color: var(--text-dim); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; transition: background .15s; }
  .pet-win-bar button:hover { background: var(--hover); color: var(--text); }
  .pet-yard { position: relative; height: 134px; overflow: hidden; border-top: 1px solid var(--border);
    background: linear-gradient(to bottom, transparent 58%, rgba(90,175,100,.16) 100%); }
  .pet-yard::after { content: ''; position: absolute; left: 0; right: 0; bottom: 13px; height: 1px; background: rgba(90,140,90,.22); pointer-events: none; }
  .pet-yard .pet-layer { position: absolute; left: 0; right: 0; bottom: 14px; height: 0; z-index: 1; }
  .pet-badge.open { opacity: 1; }

  .window { overflow: hidden; overflow: clip; }
  @media (max-width: 700px) {
    #kanbanTools, #diaryTools { flex-wrap: wrap; flex: 1 1 100%; row-gap: 6px; }
    .toolbar { overflow-x: hidden; }
    #search { width: 120px; }
  }

  /* ПК: окно занимает экран, а не коробку 1400×900 */
  body { padding: 10px; }
  .window { max-width: none; max-height: none; border-radius: 14px; }
  .no-traffic .traffic { display: none; }
  @media (max-width: 700px) { body { padding: 0; } .window { border-radius: 0; } }

  /* Видимый фокус для работы с клавиатуры */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card:focus-visible { outline-offset: 3px; }
  .card:focus-within .card-actions { opacity: 1; }
  input[type="text"]:focus-visible, input[type="date"]:focus-visible, textarea:focus-visible, select:focus-visible { outline-offset: 0; }
  /* ---- Мягкие скруглённые поля ввода вместо угловатой рамки ---- */
  input:focus-visible, textarea:focus-visible, select:focus-visible, [contenteditable]:focus-visible { outline: none !important; }
  input[type="text"], input[type="search"], input[type="date"], input[type="time"], input[type="number"], input:not([type]), textarea, select { border-radius: 10px; transition: box-shadow .18s, border-color .18s, background .18s; }
  input:focus, textarea:focus, select:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); border-color: color-mix(in srgb, var(--accent) 55%, var(--border-strong)); }
  .diary-title-input, .diary-content-input { width: calc(100% + 24px); margin-left: -12px; margin-right: -12px; padding-left: 12px; padding-right: 12px; border-radius: 14px; }
  .diary-title-input { padding-top: 8px; padding-bottom: 8px; border-bottom-color: transparent; }
  .diary-title-input:focus, .diary-content-input:focus { background: color-mix(in srgb, var(--accent) 5%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent); border-color: transparent; border-bottom-color: transparent; }
  .diary-preview { margin-left: -12px; margin-right: -12px; padding-left: 12px; padding-right: 12px; }

  /* ============ ЕДИНАЯ ТЕМА: радиусы, тени, поля, скролл ============ */
  :root { --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px; --ease: cubic-bezier(.22, 1, .36, 1);
    --sh-1: 0 1px 2px rgba(20,30,90,.05), 0 0 0 1px var(--border);
    --sh-2: 0 6px 20px rgba(20,30,90,.10), 0 0 0 1px var(--border);
    --sh-3: 0 18px 48px rgba(20,30,90,.20), 0 0 0 1px var(--border); }
  ::selection { background: var(--accent-light); }
  /* блоки и карточки */
  .column, .add-column, .stats-panel, .stat-card, .sync-banner, .map-controls, .diary-day-tasks { border-radius: var(--r-lg); }
  .card, .quick-preview, .diary-chips-row, .diary-fmt, .diary-item, .drop-placeholder { border-radius: var(--r-md); }
  .card { box-shadow: var(--sh-1); transition: box-shadow .2s var(--ease), background-color .2s var(--ease); }
  .card:hover { box-shadow: var(--sh-2); }
  .stat-card { box-shadow: var(--sh-1); }
  .card-img, .lightbox img, .diary-item-thumb, .diary-task-chip { border-radius: var(--r-sm); }
  .diary-inner, .modal { border-radius: var(--r-xl); }
  /* окна, меню, уведомления */
  .modal, .popup, .toast, .pet-win { box-shadow: var(--sh-3); }
  .popup, .pet-win { border-radius: var(--r-lg); }
  .toast { border-radius: var(--r-md); }
  .popup-item, .tbp-item, .prio-opt, .status-opt, .col-nav, .card-menu-btn, .card-pomo-btn, .cl-add-btn { border-radius: var(--r-sm); }
  .popup-sep, .tbp-sep { background: var(--border); height: 1px; border: 0; margin: 4px 8px; }
  /* метки и бейджи */
  .tag, .card-prio, .card-due, .card-status, .card-taskdate, .card-from, .card-pomo, .col-count { border-radius: var(--r-sm); }
  /* поля: поиск и фильтры — пилюли, как кнопки тулбара */
  #search, .filter-select { border-radius: 999px; }
  .quick-input, .tbp-field, .modal input, .modal textarea, .modal select { border-radius: var(--r-md); }
  .quick-input:focus, .tbp-field:focus, #search:focus, .filter-select:focus, .modal input:focus, .modal textarea:focus, .modal select:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); border-color: color-mix(in srgb, var(--accent) 55%, var(--border-strong)); outline: none; }
  /* скроллбары: тонкие и скруглённые */
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-thumb { background-color: var(--border-strong); border: 3px solid transparent; background-clip: content-box; border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--text-dim); }
  ::-webkit-scrollbar-corner { background: transparent; }

  /* ---- Палитра команд (Ctrl+K) ---- */
  #btnFull { display: none; }
  .cmdk-btn { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 6px 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--hover); color: var(--text-dim); font: inherit; font-size: 12.5px; cursor: pointer; transition: background .15s, color .15s; }
  .cmdk-btn:hover { background: var(--active); color: var(--text); }
  kbd { font: inherit; font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-soft); }
  .cmdk-bg { position: fixed; inset: 0; z-index: 10000; display: none; align-items: flex-start; justify-content: center; padding-top: 13vh; background: rgba(10,14,30,.28); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .cmdk-bg.show { display: flex; }
  .cmdk { width: min(580px, 92vw); background: var(--bg-modal); color: var(--text); border-radius: var(--r-xl); box-shadow: var(--sh-3); overflow: hidden; animation: cmdkIn .18s var(--ease); }
  @keyframes cmdkIn { from { opacity: 0; transform: translateY(-8px) scale(.98); } }
  .cmdk-input { width: 100%; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; font-size: 17px; padding: 18px 22px; outline: none; border-radius: 0; box-shadow: none; }
  .cmdk-input:focus { box-shadow: none; border-color: var(--border); }
  .cmdk-list { max-height: min(380px, 50vh); overflow-y: auto; padding: 8px; }
  .cmdk-item { display: flex; align-items: baseline; gap: 10px; padding: 9px 12px; border-radius: var(--r-md); cursor: pointer; }
  .cmdk-item.on { background: var(--accent-light); }
  .cmdk-t { min-width: 0; font-size: 14px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmdk-sub { min-width: 0; font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmdk-tag { margin-left: auto; flex: none; font-size: 11px; color: var(--text-dim); padding: 2px 8px; border-radius: var(--r-sm); background: var(--hover); }
  .cmdk-empty { padding: 22px; text-align: center; color: var(--text-dim); font-size: 13.5px; }
  .cmdk-foot { display: flex; gap: 16px; padding: 10px 18px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-dim); }
  @media (max-width: 700px) { .cmdk-btn kbd { display: none; } }

  /* ---- Сворачивание колонок ---- */
  .col-fold { width: 22px; height: 22px; border: 0; background: transparent; border-radius: var(--r-sm); color: var(--text-dim); cursor: pointer; font-size: 15px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s, background .15s; flex: none; }
  .column-header:hover .col-fold, .col-fold:focus-visible { opacity: 1; }
  .col-fold:hover { background: var(--hover); color: var(--text); }
  @media (hover: none) { .col-fold { opacity: 1; } }
  .col-vtitle { display: none; }
  .column.collapsed { flex: 0 0 56px; width: 56px; min-width: 56px; max-width: 56px; }
  .column.collapsed .column-body, .column.collapsed .quick-add, .column.collapsed .col-title, .column.collapsed .col-menu, .column.collapsed .col-fold { display: none; }
  .column.collapsed .column-header { flex-direction: column; align-items: center; gap: 10px; padding: 14px 0; height: auto; cursor: pointer; border-radius: var(--r-lg); }
  .column.collapsed .column-header:hover { background: var(--hover); }

  /* ---- Резервные копии ---- */
  .bk-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 12px; color: var(--text-dim); }
  .bk-list { display: flex; flex-direction: column; gap: 6px; max-height: min(52vh, 420px); overflow-y: auto; padding: 2px; }
  .bk-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--r-md); background: var(--hover); }
  .bk-main { flex: 1; min-width: 0; }
  .bk-main b { font-size: 13.5px; font-weight: 600; margin-right: 8px; }
  .bk-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .bk-tag { font-size: 11px; padding: 2px 8px; border-radius: var(--r-sm); background: var(--accent-light); color: var(--accent); }
  .bk-tag.manual { background: rgba(52,199,89,.16); color: #1f9d45; }
  .bk-tag.before { background: rgba(255,149,0,.16); color: #c26e00; }
  .bk-row button { border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12.5px; cursor: pointer; background: var(--bg-card); color: var(--text); box-shadow: var(--sh-1); }
  .bk-row button:hover { background: var(--accent); color: #fff; }
  .bk-empty { padding: 18px; text-align: center; color: var(--text-dim); font-size: 13px; }
  .column.collapsed .col-vtitle { display: block; writing-mode: vertical-rl; font-size: 13px; font-weight: 600; color: var(--text); max-height: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ПК: колонки занимают свободное место, но не растягиваются бесконечно */
  @media (min-width: 701px) {
    .column { flex: 1 1 300px; width: auto; min-width: 300px; max-width: 520px; }
  }

  @media (max-width: 1100px) { .file-btn #fileLabel { display: none; } .file-btn { padding: 0 10px; } }

  /* ---- Десктоп-версия: вместо «окна в окне» интерфейс занимает всё настоящее окно ---- */
  html.desktop body { padding: 0; background: var(--bg-window); }
  html.desktop .window { width: 100%; height: 100%; max-width: none; max-height: none; border-radius: 0; box-shadow: none; }
  html.desktop .traffic { display: none; }
  html.desktop #btnFile, html.desktop #statSync, html.desktop #syncBanner { display: none !important; }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="traffic">
      <span class="red"></span>
      <span class="yellow"></span>
      <span class="green"></span>
    </div>
    <input id="docName" value="Моя доска" spellcheck="false">
    <div class="titlebar-right">
      <button class="user-chip" id="userChip" type="button" title="Сменить имя">
        <span class="user-avatar" id="userAvatar"></span>
        <span class="user-name" id="userNameLabel"></span>
      </button>
      <button class="clock" id="clock" type="button" title="Открыть сегодня в дневнике">
        <span class="clock-date" id="clockDate"></span>
        <span class="clock-time" id="clockTime"></span>
      </button>
      <button class="cmdk-btn" id="btnCmdk" type="button" title="Команды (Ctrl+K)">Команды <kbd>Ctrl K</kbd></button>
      <button class="icon-btn" id="btnHelp" title="Справка" style="font-weight:700;font-size:13px;">?</button>
      <button class="icon-btn" id="btnBg" title="Фон">🎨</button>
      <button class="icon-btn" id="btnTheme" title="Тема">🌙</button>
      <button class="icon-btn" id="btnFull"  title="На весь экран">⛶</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="segmented">
      <button class="seg-btn active" data-tab="kanban">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="5" height="7" rx="1.5"/></svg>
        Канбан
      </button>
      <button class="seg-btn" data-tab="diary">
        <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h12a2 2 0 012 2v16l-4-3-4 3-4-3-4 3z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        Дневник
      </button>
    </div>

    <div class="tb-sep"></div>

    <div class="segmented small" style="gap:2px;">
      <button class="tbtn" id="btnUndo" title="Отменить" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14l-4-4 4-4"/><path d="M5 10h9a5 5 0 015 5v1"/></svg>
      </button>
      <button class="tbtn" id="btnRedo" title="Повторить" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l4 4-4 4"/><path d="M19 10h-9a5 5 0 00-5 5v1"/></svg>
      </button>
    </div>

    <div id="kanbanTools" style="display:flex;gap:8px;align-items:center;">
      <div class="segmented small">
        <button class="seg-btn active" data-kview="board">Доска</button>
        <button class="seg-btn" data-kview="map">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><line x1="12" y1="12" x2="5" y2="6"/><line x1="12" y1="12" x2="19" y2="6"/><line x1="12" y1="12" x2="5" y2="18"/><line x1="12" y1="12" x2="19" y2="18"/></svg>
          Карта
        </button>
      </div>

      <button class="tbtn primary" id="btnNewCard" title="Новая задача">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Задача
      </button>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input id="search" type="text" placeholder="Поиск" autocomplete="off">
      </div>

      <button class="tbtn" id="btnFilters" type="button" title="Фильтры">
        <svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>
        Фильтры<span class="fbadge" id="filtersBadge" style="display:none;"></span>
      </button>

      <button class="tbtn" id="btnTemplates" title="Шаблоны" style="display:none;">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>
      </button>
    </div>

    <div id="diaryTools" style="display:none;gap:8px;align-items:center;">
      <button class="tbtn primary" id="btnDiaryToday">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
        Сегодня
      </button>
      <div class="date-jump">
        <input type="date" id="diaryDateJump">
      </div>
      <button class="tbtn" id="btnDiarySummary" type="button">Итоги</button>
    </div>

    <div class="tb-sep" style="margin-left:auto;"></div>

    <button class="tbtn install" id="btnInstall" title="Установить как приложение" style="display:none;">
      <svg viewBox="0 0 24 24"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/></svg>
      Установить
    </button>

    <button class="tbtn" id="btnExport" title="Экспорт в JSON" style="display:none;">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button class="tbtn" id="btnImport" title="Импорт из JSON" style="display:none;">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </button>

    <button class="tbtn" id="btnMore" type="button" title="Ещё">

    <div class="tb-sep"></div>

    <button class="tbtn file-btn" id="btnFile">

      <span id="fileLabel">Выбрать файл</span>
      <span class="sync-dot none" id="syncDot"></span>

  </div>


  <div class="tb-pop" id="filtersPop">
    <div class="tbp-title">Фильтры</div>

      </select></label>

        <option value="low">Низкий</option>

        <option value="">Все теги</option>
      </select></label>

        <span>Сбросить фильтры</span>

  <div class="tb-pop" id="morePop">
    <div class="tbp-title">Карточки</div>

    <button class="tbp-item" id="moreTemplates" type="button">Шаблоны карточек</button>

    <button class="tbp-item" id="moreImport" type="button">Импорт из JSON</button>

    <button class="tbp-item" id="moreBackups" type="button">Резервные копии</button>
  </div>

  <div class="content-wrap">
    <div class="sync-banner" id="syncBanner" style="display:none;">
      <span id="bannerText"></span>
      <button id="bannerAction">Подключить</button>
      <button id="bannerClose" title="Скрыть">✕</button>
    </div>

    <div class="tab-content active" id="kanbanBoardTab">
      <div class="board" id="board"></div>
    </div>

    <div class="tab-content" id="kanbanMapTab">
      <div class="map-view" id="mapView">
        <canvas id="mapCanvas"></canvas>
        <div class="map-controls">
          <div class="segmented small">
            <button class="seg-btn active" data-mapgroup="priority">По приоритету</button>
            <button class="seg-btn" data-mapgroup="status">По статусу</button>
            <button class="seg-btn" data-mapgroup="due">По сроку</button>
          </div>
        </div>

  /* ============================================================

  function confirmDialog(message, opts) {
    opts = opts || {};
    return new Promise(function(resolve) {
      var overlay = document.createElement('div');
      overlay.className = 'confirm-overlay';
      var box = document.createElement('div');
      box.className = 'confirm-box';
      var title = opts.title || 'Подтверждение';
      var okLabel = opts.okLabel || 'ОК';
      var cancelLabel = opts.cancelLabel || 'Отмена';
      var danger = opts.danger !== false;
      box.innerHTML =
        '<h3>' + escapeHtml(title) + '</h3>' +
        '<p>' + message + '</p>' +
        '<div class="actions">' +
          '<button class="cancel" type="button">' + escapeHtml(cancelLabel) + '</button>' +
          '<button class="ok' + (danger ? ' danger' : '') + '" type="button">' + escapeHtml(okLabel) + '</button>' +
        '</div>';
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      var done = false;
      function finish(result) {
        if (done) return;
        done = true;
        overlay.remove();
        document.removeEventListener('keydown', onKey, true);
        resolve(result);
      }
      function onKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.stopPropagation(); finish(true); }
        else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
      }
      var okBtn = box.querySelector('.ok');
      var cancelBtn = box.querySelector('.cancel');
      okBtn.onclick = function() { finish(true); };
      cancelBtn.onclick = function() { finish(false); };
      overlay.addEventListener('mousedown', function(e) { if (e.target === overlay) finish(false); });
      document.addEventListener('keydown', onKey, true);
      setTimeout(function() { okBtn.focus(); }, 50);
    });
  }

  /* ============================================================

  function uid(p) { return (p||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function escapeAttr(s) { return escapeHtml(s); }
  function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function parseTags(str) { return str.split(',').map(function(t){return t.trim();}).filter(function(t){return t;}); }
  function formatDate(iso) {
    if (!iso) return '';
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    var m = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
    return d.getDate() + ' ' + m[d.getMonth()];

  function dueStatus(iso) {

    var diff = Math.round((d - t) / 86400000);
    if (diff < 0) return 'overdue';
    if (diff <= 2) return 'soon';
    return null;
  }
  function isDoneCard(card, col) {

  }
  function doneKey(card) {

    return t ? dateKeyFromDate(new Date(t)) : '';
  }
  function afterColumnChange(card, target) {
    if (state.columns.length > 1 && state.columns[state.columns.length - 1] === target) card.doneAt = Date.now();
    else if (card.status !== 'done') card.doneAt = 0;

  function formatMonthShort(key) {
    var d = new Date(key + 'T00:00:00');
    return ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()];

  function getDiaryEntry(k) { return state.diary[k] || null; }
  function ensureDiaryEntry(k) {
    if (!state.diary[k]) {

  function diaryEntryHasData(e) {

  function pluralTasks(n) {
    var m10 = n % 10, m100 = n % 100;
