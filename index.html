  }
  var _mapFont = null;
  function mapFontFamily() { return _mapFont || (_mapFont = getComputedStyle(document.body).fontFamily); }
  var _hexCache = {};
  function hexA(hex, a) {
    var pre = _hexCache[hex];
    if (pre) return pre + a + ')';
    var res = hexA0(hex, 0);
    if (typeof hex === 'string' && hex.charAt(0) === '#' && typeof res === 'string' && res.indexOf('rgba(') === 0) { pre = res.slice(0, res.lastIndexOf(',') + 1); _hexCache[hex] = pre; return pre + a + ')'; }
    return hexA0(hex, a);
  }
  function hexA0(hex, a) {
    if (typeof hex !== 'string' || hex.charAt(0) !== '#') return hex;
    var h = hex.slice(1);
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var r = parseInt(h.slice(0,2), 16);
    var g = parseInt(h.slice(2,4), 16);
    var b = parseInt(h.slice(4,6), 16);
    if (isNaN(r)) return hex;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  /* ============================================================
     IMAGE COMPRESSION
     ============================================================ */
  function encodeCanvasSmall(c) {
    var url = '';
    try { url = c.toDataURL('image/webp', IMG_QUALITY); } catch (e) {}
    if (url.indexOf('data:image/webp') !== 0) url = c.toDataURL('image/jpeg', IMG_QUALITY);
    return url;
  }
  function compressImage(file) {
    return new Promise(function(resolve, reject) {
      if (!file || file.type.indexOf('image/') !== 0) { reject(new Error('Не картинка')); return; }
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          try {
            var w = img.naturalWidth || img.width;
            var h = img.naturalHeight || img.height;
            var scale = Math.min(1, IMG_MAX_DIM / Math.max(w, h));
            var nw = Math.max(1, Math.round(w * scale));
            var nh = Math.max(1, Math.round(h * scale));
            var c = document.createElement('canvas');
            c.width = nw; c.height = nh;
            var cx = c.getContext('2d');
            cx.fillStyle = '#fff'; cx.fillRect(0, 0, nw, nh);
            cx.drawImage(img, 0, 0, nw, nh);
            var url = encodeCanvasSmall(c);
            resolve({ dataUrl: url, width: nw, height: nh, size: url.length });
          } catch (err) { reject(new Error('Не удалось обработать картинку')); }
        };
        img.onerror = function() { reject(new Error('Повреждённый файл')); };
        img.src = e.target.result;
      };
      reader.onerror = function() { reject(new Error('Ошибка чтения')); };
      reader.readAsDataURL(file);
    });
  }

  /* ============================================================
     INDEXEDDB
     ============================================================ */
  var idb = {
    _db: null,
    open: function() {
      if (this._db) return Promise.resolve(this._db);
      var self = this;
      return new Promise(function(resolve, reject) {
        var req = indexedDB.open('kanban_fs', 1);
        req.onupgradeneeded = function() {
          if (!req.result.objectStoreNames.contains('kv')) req.result.createObjectStore('kv');
        };
        req.onsuccess = function() { self._db = req.result; resolve(req.result); };
        req.onerror = function() { reject(req.error); };
      });
    },
    get: function(key) {
      return this.open().then(function(db) {
        return new Promise(function(resolve, reject) {
          var r = db.transaction('kv','readonly').objectStore('kv').get(key);
          r.onsuccess = function() { resolve(r.result); };
          r.onerror = function() { reject(r.error); };
        });
      });
    },
    set: function(key, value) {
      return this.open().then(function(db) {
        return new Promise(function(resolve, reject) {
          var r = db.transaction('kv','readwrite').objectStore('kv').put(value, key);
          r.onsuccess = function() { resolve(); };
          r.onerror = function() { reject(r.error); };
        });
      });
    }
  };

  /* ============================================================
     FILE
     ============================================================ */
  var fileHandle = null;
  var needsPermission = false;
  var writeTimer = null;

  async function initFileHandle() {
    if (!FSA_SUPPORTED) return false;
    try {
      var h = await idb.get('fileHandle');
      if (!h) return false;
      fileHandle = h;
      var perm = await fileHandle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') return true;
      needsPermission = true; return false;
    } catch (e) { return false; }
  }
  async function reconnectFile() {
    if (!fileHandle) return false;
    try {
      var p = await fileHandle.requestPermission({ mode: 'readwrite' });
      if (p === 'granted') { needsPermission = false; return true; }
    } catch (e) {}
    return false;
  }
  async function pickSaveFile() {
    if (!FSA_SUPPORTED) { toast('Браузер не поддерживает работу с файлами'); return false; }
    try {
      var h = await window.showSaveFilePicker({
        suggestedName: 'kanban.json',
        types: [{ description: 'Kanban JSON', accept: { 'application/json': ['.json'] } }]
      });
      fileHandle = h; needsPermission = false;
      await idb.set('fileHandle', h);
      await writeToFileNow();
      updateFileUI();
      toast('Файл создан: ' + h.name);
      return true;
    } catch (e) {
      if (e.name !== 'AbortError') toast('Ошибка: ' + e.message);
      return false;
    }
  }
  async function pickOpenFile() {
    if (!FSA_SUPPORTED) { toast('Не поддерживается'); return false; }
    try {
      var hs = await window.showOpenFilePicker({
        types: [{ description: 'Kanban JSON', accept: { 'application/json': ['.json'] } }],
        multiple: false
      });
      fileHandle = hs[0]; needsPermission = false;
      await idb.set('fileHandle', fileHandle);
      var ok = await readFromFile();
      updateFileUI();
      if (ok) { applyLoadedState(); toast('Загружено из ' + fileHandle.name); }
      else toast('Файл пустой или неверного формата');
      return true;
    } catch (e) {
      if (e.name !== 'AbortError') toast('Ошибка: ' + e.message);
      return false;
    }
  }

  function normalizeColumns(cols) {
    if (!Array.isArray(cols)) return [];
    cols.forEach(function(col) {
      if (!col.id) col.id = uid('col');
      if (!col.color) col.color = COLORS[0];
      if (typeof col.wipLimit !== 'number') col.wipLimit = 0;
      if (!Array.isArray(col.cards)) col.cards = [];
      col.cards.forEach(normalizeCard);
    });
    return cols;
  }
  function normalizeCard(card) {
    if (!card.id) card.id = uid('c');
    if (!card.tags) card.tags = [];
    if (!card.priority) card.priority = 'none';
    if (typeof card.status !== 'string' || !STATUSES[card.status]) card.status = 'open';
    if (typeof card.from !== 'string') card.from = '';
    if (typeof card.taskDate !== 'string') card.taskDate = '';
    if (!Array.isArray(card.checklist)) card.checklist = [];
    card.checklist.forEach(function(it) {
      if (!it.id) it.id = uid('cl');
      if (typeof it.text !== 'string') it.text = '';
      if (typeof it.done !== 'boolean') it.done = false;
    });
    if (typeof card.pomoSeconds !== 'number') card.pomoSeconds = 0;
    if (typeof card.createdAt !== 'number') card.createdAt = Date.now();
    if (typeof card.columnEnteredAt !== 'number') card.columnEnteredAt = Date.now();
    if (typeof card.updatedAt !== 'number') card.updatedAt = Date.now();
  }
  function normalizeDiary(d) {
    if (!d || typeof d !== 'object') return {};
    var out = {};
    Object.keys(d).forEach(function(k) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      var v = d[k]; if (!v || typeof v !== 'object') return;
      out[k] = {
        title: typeof v.title === 'string' ? v.title : '',
        content: typeof v.content === 'string' ? v.content : '',
        images: Array.isArray(v.images) ? v.images.filter(function(x){return typeof x==='string';}) : [],
        mood: typeof v.mood === 'string' ? v.mood : '',
        weather: typeof v.weather === 'string' ? v.weather : '',
        createdAt: v.createdAt || Date.now(),
        updatedAt: v.updatedAt || Date.now()
      };
    });
    return out;
  }
  function normalizeTemplates(t) {
    if (!Array.isArray(t)) return [];
    return t.map(function(x) {
      if (!x.id) x.id = uid('tpl');
      return {
        id: x.id,
        name: x.name || 'Шаблон',

  function packBoard(extra) {

        o[k] = v;
      });
      diary[d] = o;
    });

      version: 10,
      savedAt: new Date().toISOString(),
      activeTab: state.activeTab,
      kanbanView: state.kanbanView,
      mapGrouping: state.mapGrouping,

  function unpackBoard(data) {

  function confettiBurst(x, y) {

    document.body.appendChild(cv);

    var ps = [];
    for (var i = 0; i < 70; i++) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.15, v = 5 + Math.random() * 7;
      ps.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 5 + Math.random() * 5, h: 3 + Math.random() * 4,
                rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4, c: colors[i % colors.length], life: 0 });
    }
    var t0 = performance.now(), last = t0;
    function frame(now) {
      var dt = Math.min(32, now - last) / 16.67; last = now;
      ctx.clearRect(0, 0, W, H);
      var alive = false;
      ps.forEach(function(p) {
        p.vy += 0.28 * dt; p.vx *= 0.992; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life += dt;
        var al = Math.max(0, 1 - p.life / 90);

          ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
        }
      });

    }

  }

      if (!items.length) { list.innerHTML = '<div class="cmdk-empty">Ничего не найдено</div>'; return; }
      items.forEach(function(it, i) {
        var r = document.createElement('div');
        r.className = 'cmdk-item' + (i === sel ? ' on' : '');
        r.innerHTML = '<span class="cmdk-t"></span><span class="cmdk-sub"></span><span class="cmdk-tag"></span>';
        r.children[0].textContent = it.t;
        r.children[1].textContent = it.sub || '';
        r.children[2].textContent = it.tag;
        r.addEventListener('mousemove', function() { if (sel !== i) { sel = i; mark(); } });
        r.addEventListener('click', function() { run(i); });
        list.appendChild(r);
      });
    }
    function open() { bg.classList.add('show'); inp.value = ''; sel = 0; paint(); setTimeout(function() { inp.focus(); }, 0); }
    inp.addEventListener('input', function() { sel = 0; paint(); });
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); if (items.length) { sel = (sel + 1) % items.length; mark(); } }
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (items.length) { sel = (sel - 1 + items.length) % items.length; mark(); } }
      else if (e.key === 'Enter') { e.preventDefault(); run(sel); }
      else if (e.key === 'Escape') { e.preventDefault(); close(); }
    });
    bg.addEventListener('mousedown', function(e) { if (e.target === bg) close(); });
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.code === 'KeyK') { e.preventDefault(); if (bg.classList.contains('show')) close(); else open(); }
    });
    $('btnCmdk').addEventListener('click', open);

  /* ===== Резервные копии (IndexedDB): авто, вручную, перед опасными действиями ===== */
  var bkDb = null, bkTimer = null, bkLastAt = 0, bkDirty = false;
  var BK_GAP = 10 * 60 * 1000, BK_MAX_AUTO = 15, BK_MAX_KEEP = 15;
  var BK_KIND = { auto: 'Авто', manual: 'Вручную', before: 'Перед действием' };
  function bkOpen() {
    if (bkDb) return Promise.resolve(bkDb);
    return new Promise(function(res, rej) {
      var rq = indexedDB.open('board_backups_v1', 1);
      rq.onupgradeneeded = function() { rq.result.createObjectStore('b', { keyPath: 'id' }); };
      rq.onsuccess = function() { bkDb = rq.result; res(bkDb); };
      rq.onerror = function() { rej(rq.error); };
    });
  }
  function bkTx(mode, fn) {
    return bkOpen().then(function(db) {
      return new Promise(function(res, rej) {
        var rq = fn(db.transaction('b', mode).objectStore('b'));
        rq.onsuccess = function() { res(rq.result); };
        rq.onerror = function() { rej(rq.error); };
      });
    });
  }
  function bkAll() {
    return bkTx('readonly', function(st) { return st.getAll(); }).then(function(l) { return l.sort(function(a, b) { return b.ts - a.ts; }); });
  }
  function bkPrune() {
    return bkAll().then(function(list) {
      var a = 0, o = 0, del = [];
      list.forEach(function(r) {
        if (r.kind === 'auto') { if (++a > BK_MAX_AUTO) del.push(r.id); }
        else if (++o > BK_MAX_KEEP) del.push(r.id);
      });
      return Promise.all(del.map(function(id) { return bkTx('readwrite', function(st) { return st.delete(id); }); }));
    });
  }
  function bkCreate(kind, label, announce) {
    var data = packBoard();
    data.savedAt = '';
    var json = JSON.stringify(data), cards = 0;
    state.columns.forEach(function(c) { cards += c.cards.length; });
    var rec = {
      id: 'b' + Date.now() + Math.floor(Math.random() * 1000), ts: Date.now(), kind: kind, label: label,
      cards: cards, bytes: json.length, json: json,
      entries: Object.keys(state.diary).filter(function(k) { return diaryEntryHasData(state.diary[k]); }).length
    };
    return bkAll().then(function(list) {
      if (list.length && list[0].json === json) { if (announce) toast('Изменений с последней копии нет'); return null; }
      return bkTx('readwrite', function(st) { return st.put(rec); }).then(function() {
        bkLastAt = rec.ts; bkDirty = false;
        if (announce) toast('Копия создана');
        return bkPrune();
      });
    }).catch(function() { if (announce) toast('Не удалось создать копию'); });
  }
  function backupTouch() {
    bkDirty = true;

    var wait = Math.max(30000, bkLastAt + BK_GAP - Date.now());

  function bkFmt(ts) {
    var diff = Date.now() - ts, rel = '';

    else if (diff < 86400000) rel = Math.round(diff / 3600000) + ' ч назад';
    return new Date(ts).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + (rel ? ' · ' + rel : '');
  }

  function cardMatchesFilters(c) {
    var f = state.filters;
    if (f.search) {
      var q = f.search.toLowerCase();
      var inT = c.title.toLowerCase().indexOf(q) !== -1;
      var inD = (c.description||'').toLowerCase().indexOf(q) !== -1;
      var inTags = (c.tags||[]).some(function(t){ return t.toLowerCase().indexOf(q) !== -1; });
      var inChk = (c.checklist||[]).some(function(it){ return it.text.toLowerCase().indexOf(q) !== -1; });
      var inFrom = (c.from||'').toLowerCase().indexOf(q) !== -1;
      var inStatus = (STATUSES[c.status] ? STATUSES[c.status].name : '').toLowerCase().indexOf(q) !== -1;
      if (!inT && !inD && !inTags && !inChk && !inFrom && !inStatus) return false;
    }
    if (f.status && c.status !== f.status) return false;
    if (f.priority && c.priority !== f.priority) return false;
    if (f.tag && (c.tags||[]).indexOf(f.tag) === -1) return false;
    return true;
  }
  function hasActiveFilters() { var f = state.filters; return !!(f.search || f.status || f.priority || f.tag); }

  function parseQuickInput(text) {
    var priority = 'none', tags = [], due = '', title = text;
    title = title.replace(/!(\w+|[а-яё]+)/gi, function(m, p) {
      var pl = p.toLowerCase();
      if (pl === 'h' || pl === 'high' || pl === 'в' || pl === 'выс' || pl === 'высокий') { priority = 'high'; return ''; }
      if (pl === 'm' || pl === 'med' || pl === 'medium' || pl === 'с' || pl === 'сред' || pl === 'средний') { priority = 'medium'; return ''; }
      if (pl === 'l' || pl === 'low' || pl === 'н' || pl === 'низ' || pl === 'низкий') { priority = 'low'; return ''; }
      return m;
    });
    title = title.replace(/#([\w\u0400-\u04FF-]+)/g, function(m, t) { tags.push(t); return ''; });
    var now = new Date();
    title = title.replace(/@(\d{4}-\d{2}-\d{2})/g, function(m, d) { due = d; return ''; });
    if (!due) {
      title = title.replace(/@(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?/g, function(m, dd, mm, yyyy) {
        var year = yyyy ? (yyyy.length === 2 ? 2000 + parseInt(yyyy,10) : parseInt(yyyy,10)) : now.getFullYear();
        var dt = new Date(year, parseInt(mm,10)-1, parseInt(dd,10));
        due = dateKeyFromDate(dt); return '';
      });
    }
    if (!due) {
      title = title.replace(/@(сегодня|today)/gi, function() { due = todayKey(); return ''; });
      title = title.replace(/@(завтра|tomorrow)/gi, function() {
        var d = new Date(); d.setDate(d.getDate()+1); due = dateKeyFromDate(d); return '';
      });
    }
    title = title.replace(/\s+/g, ' ').trim();
    return { title: title, priority: priority, tags: tags, due: due };
  }

  function formatPomoTime(seconds, running) {
    if (running) {
      var rem = Math.max(0, Math.floor((state.pomodoro.endsAt - Date.now()) / 1000));
      var m = Math.floor(rem / 60);
      var s = rem % 60;
      return m + ':' + String(s).padStart(2, '0');
    }
    var m2 = Math.floor(seconds / 60);
    if (m2 >= 60) {
      var h = Math.floor(m2 / 60);
      var mm = m2 % 60;
      return h + 'ч ' + mm + 'м';
    }
    return m2 + 'м';
  }

  function removePlaceholder() {
    if (placeholderEl && placeholderEl.parentNode) placeholderEl.parentNode.removeChild(placeholderEl);
    placeholderEl = null;
  }
  function onColumnDragOver(e) {
    if (!dragCardId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    var body = e.currentTarget;
    var col = body.closest('.column');
    if (col) col.classList.add('drag-over');
    if (!placeholderEl) placeholderEl = document.createElement('div');
    placeholderEl.className = 'drop-placeholder';
    var after = getDragAfterElement(body, e.clientY);
    if (after == null) body.appendChild(placeholderEl);
    else body.insertBefore(placeholderEl, after);
  }
  function onColumnDragLeave(e) {
    var body = e.currentTarget;
    if (e.relatedTarget && body.contains(e.relatedTarget)) return;
    var col = body.closest('.column');
    if (col) col.classList.remove('drag-over');
  }
  function getDragAfterElement(container, y) {
    var els = Array.prototype.slice.call(container.querySelectorAll('.card:not(.dragging)'));
    var closest = null, closestOffset = Number.NEGATIVE_INFINITY;
    els.forEach(function(child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closestOffset) { closestOffset = offset; closest = child; }
    });
    return closest;
  }
  async function onColumnDrop(e) {
    e.preventDefault();
    if (!dragCardId) return;
    var body = e.currentTarget;
    await finishCardMove(body.dataset.colId, body);
  }

  async function finishCardMove(targetColId, body) {
    if (!dragCardId) return;
    var targetCol = state.columns.find(function(c){ return c.id === targetColId; });
    var sourceCol = state.columns.find(function(c){ return c.id === dragSourceColId; });
    if (!targetCol || !sourceCol) { removePlaceholder(); return; }
    var idx = sourceCol.cards.findIndex(function(c){ return c.id === dragCardId; });
    if (idx === -1) { removePlaceholder(); return; }

    if (targetCol.id !== sourceCol.id && targetCol.wipLimit > 0 && targetCol.cards.length >= targetCol.wipLimit) {
      var proceed = await confirmDialog(
        'В колонке <b>«' + escapeHtml(targetCol.title) + '»</b> уже ' + targetCol.cards.length + '/' + targetCol.wipLimit + ' задач (лимит). Всё равно переместить?',
        { title: 'WIP-лимит', okLabel: 'Переместить', danger: false }
      );
      if (!proceed) { removePlaceholder(); return; }
    }

    if (!state.columns.some(function(c){ return c.id === targetColId; })) { removePlaceholder(); return; }
    var src2 = state.columns.find(function(c){ return c.id === dragSourceColId; });
    var tgt2 = state.columns.find(function(c){ return c.id === targetColId; });
    if (!src2 || !tgt2) { removePlaceholder(); return; }
    var idx2 = src2.cards.findIndex(function(c){ return c.id === dragCardId; });
    if (idx2 === -1) { removePlaceholder(); return; }
    var card = src2.cards[idx2];
    var targetIdx = 0;
    if (placeholderEl && placeholderEl.parentNode === body) {
      var children = Array.prototype.slice.call(body.children);
      var phIdx = children.indexOf(placeholderEl);
      for (var i = 0; i < phIdx; i++) {
        var e2 = children[i];
        if (e2.classList.contains('card') && !e2.classList.contains('dragging')) targetIdx++;
      }
    } else {
      targetIdx = tgt2.cards.length;
    }
    src2.cards.splice(idx2, 1);
    if (tgt2.id !== src2.id) { card.columnEnteredAt = Date.now(); afterColumnChange(card, tgt2); }
    tgt2.cards.splice(targetIdx, 0, card);
    removePlaceholder();
    var burstRect = body.getBoundingClientRect();
    var isDone = tgt2.id !== src2.id && state.columns[state.columns.length - 1] === tgt2 && state.columns.length > 1;
    save(); render();
    if (isDone) { confettiBurst(burstRect.left + burstRect.width / 2, burstRect.top + 70); petReward(3, 6, 'Задача завершена!'); }
  }

  /* ============================================================
     TOUCH DND (телефоны/планшеты — Pointer Events)
     ============================================================ */
  (function() {
    var LONG_PRESS_MS = 160;
    var MOVE_CANCEL_PX = 10;
    var boardEl = document.getElementById('board');
    if (!boardEl || !window.PointerEvent) return;

    var pending = null; // { cardEl, pointerId, startX, startY, timer }
    var active = null;  // { pointerId, cardEl, ghost, offsetX, offsetY, lastBody }

    function isInteractive(target) {
      return !!target.closest('.card-actions, .card-img, .check-item, button, a, input, textarea, select');
    }
    function cancelPending() {
      if (pending) { clearTimeout(pending.timer); pending = null; }
    }

    boardEl.addEventListener('pointerdown', function(e) {
      if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
      var cardEl = e.target.closest && e.target.closest('.card');
      if (!cardEl || isInteractive(e.target)) return;
      cancelPending();
      pending = { cardEl: cardEl, pointerId: e.pointerId, startX: e.clientX, startY: e.clientY };
      pending.timer = setTimeout(function() { beginDrag(e, cardEl); }, LONG_PRESS_MS);
    }, { passive: true });

    boardEl.addEventListener('pointermove', function(e) {
      if (pending && pending.pointerId === e.pointerId) {
        var dx = e.clientX - pending.startX, dy = e.clientY - pending.startY;
        if (Math.sqrt(dx * dx + dy * dy) > MOVE_CANCEL_PX) cancelPending();
        return;
      }
      if (active && active.pointerId === e.pointerId) {
        e.preventDefault();
        moveDrag(e.clientX, e.clientY);
      }
    }, { passive: false });

    boardEl.addEventListener('pointerup', function(e) {
      if (pending && pending.pointerId === e.pointerId) { cancelPending(); return; }
      if (active && active.pointerId === e.pointerId) endDrag();
    });
    boardEl.addEventListener('pointercancel', function(e) {
      if (pending && pending.pointerId === e.pointerId) { cancelPending(); return; }
      if (active && active.pointerId === e.pointerId) endDrag();
    });

    function beginDrag(e, cardEl) {
      pending = null;
      var colId = cardEl.dataset.colId, cardId = cardEl.dataset.cardId;
      var col = state.columns.find(function(c) { return c.id === colId; });
      var card = col && col.cards.find(function(x) { return x.id === cardId; });
      if (!col || !card) return;

      dragCardId = cardId; dragSourceColId = colId;
      cardEl.classList.add('dragging');
      try { cardEl.setPointerCapture(e.pointerId); } catch (err) {}

      var rect = cardEl.getBoundingClientRect();
      var ghost = cardEl.cloneNode(true);
      ghost.classList.add('touch-drag-ghost');
      ghost.classList.remove('dragging');
      ghost.style.width = rect.width + 'px';
      ghost.style.left = rect.left + 'px';
      ghost.style.top = rect.top + 'px';
      document.body.appendChild(ghost);

      placeholderEl = document.createElement('div');
      placeholderEl.className = 'drop-placeholder';

      active = {
        pointerId: e.pointerId, cardEl: cardEl, ghost: ghost,
        offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
        lastBody: null
      };
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
      moveDrag(e.clientX, e.clientY);
    }

    function moveDrag(x, y) {
      if (!active) return;
      active.lx = x; active.ly = y;
      asHook = function() { if (active) moveDrag(active.lx, active.ly); };
      boardAutoScroll(x, y, true);
      active.ghost.style.left = (x - active.offsetX) + 'px';
      active.ghost.style.top = (y - active.offsetY) + 'px';

      active.ghost.style.display = 'none';
      var elUnder = document.elementFromPoint(x, y);
      active.ghost.style.display = '';
      var body = elUnder && elUnder.closest ? elUnder.closest('.column-body') : null;

      if (active.lastBody && active.lastBody !== body) {
        var prevCol = active.lastBody.closest('.column');
        if (prevCol) prevCol.classList.remove('drag-over');
      }
      if (!body) { active.lastBody = null; return; }
      var col = body.closest('.column');
      if (col) col.classList.add('drag-over');
      var after = getDragAfterElement(body, y);
      if (after == null) body.appendChild(placeholderEl);
      else body.insertBefore(placeholderEl, after);
      active.lastBody = body;
    }

    async function endDrag() {
      boardAutoScrollStop();
      var body = active.lastBody;
      var ghost = active.ghost;
      var cardEl = active.cardEl;
      active = null;
      if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
      if (cardEl) cardEl.classList.remove('dragging');
      document.querySelectorAll('.column.drag-over').forEach(function(c) { c.classList.remove('drag-over'); });
      if (body) {
        await finishCardMove(body.dataset.colId, body);
      } else {
        removePlaceholder();
        dragCardId = null; dragSourceColId = null;
      }
    }
  })();

      else if (action === 'wip') openWipDialog(col);
      else if (action === 'sort') openSortDialog(col);
      else if (action === 'duplicate') duplicateColumn(col);
      else if (action === 'clear') {
        if (col.cards.length === 0) { toast('Уже пусто'); return; }
        var colIdC = col.id;
        var countC = col.cards.length;
        var okC = await confirmDialog(
          'Удалить все <b>' + countC + '</b> задач из колонки <b>«' + escapeHtml(col.title) + '»</b>?',
          { title: 'Очистить колонку', okLabel: 'Удалить' }
        );
        if (!okC) return;
        var c2 = state.columns.find(function(x){ return x.id === colIdC; });
        if (!c2) return;
        c2.cards = []; save(); render(); toast('Очищено');
      } else if (action === 'delete') {
        if (state.columns.length <= 1) { toast('Последняя колонка'); return; }
        var colIdD = col.id;
        var countD = col.cards.length;
        var titleD = col.title;
        var msgD = countD > 0
          ? 'В колонке <b>«' + escapeHtml(titleD) + '»</b> ещё <b>' + countD + '</b> задач. Удалить колонку вместе с ними?'
          : 'Удалить колонку <b>«' + escapeHtml(titleD) + '»</b>?';
        var okD = await confirmDialog(msgD, { title: 'Удалить колонку', okLabel: 'Удалить' });
        if (!okD) return;
        state.columns = state.columns.filter(function(c){ return c.id !== colIdD; });
        save(); render(); toast('Удалена');
      }
    });
    positionPopup(popup, anchorEl);
    openPopup = popup;
  }

      '</button>';
    });
    html += '<div class="popup-sep"></div>';
    state.columns.forEach(function(c) {
      if (c.id === col.id) return;
      html += '<button class="popup-item" data-move-to="' + c.id + '"><span style="background:' + c.color + ';width:8px;height:8px;border-radius:50%;display:inline-block;"></span>→ ' + escapeHtml(c.title) + '</button>';
    });
    html += '<div class="popup-sep"></div>';
    html += '<button class="popup-item danger" data-a="delete">' + TRASH_ICON + 'Удалить</button>';
    popup.innerHTML = html;

    popup.addEventListener('click', async function(ev) {
      var item = ev.target.closest('.popup-item');
      if (!item) return;
      var action = item.dataset.a;
      var moveTo = item.dataset.moveTo;
      var setStatus = item.dataset.status;
      closePopup();
      if (action === 'edit') openCardModal(col.id, card.id);
      else if (action === 'todiary') addCardToDiary(card);
      else if (action === 'openday') openDayInDiary(card.due || todayKey());
      else if (action === 'duplicate') {
        var nc = JSON.parse(JSON.stringify(card));
        nc.id = uid('c');
        nc.title = card.title + ' (копия)';
        nc.checklist.forEach(function(it){ it.id = uid('cl'); });
        nc.createdAt = Date.now();
        nc.columnEnteredAt = Date.now();
        var idx = col.cards.findIndex(function(c){ return c.id === card.id; });
        col.cards.splice(idx + 1, 0, nc);
        save(); render(); toast('Дубликат создан');
      } else if (action === 'savetpl') { saveCardAsTemplate(card); }
      else if (action === 'delete') {
        var cId = card.id;
        var cTitle = card.title;
        var cColId = col.id;
        var ok = await confirmDialog(
          'Удалить задачу <b>«' + escapeHtml(cTitle) + '»</b>?',
          { title: 'Удалить задачу', okLabel: 'Удалить' }
        );
        if (!ok) return;
        var c2 = state.columns.find(function(x){ return x.id === cColId; });
        if (!c2) return;
        c2.cards = c2.cards.filter(function(c){ return c.id !== cId; });
        if (state.pomodoro.cardId === cId) stopPomodoro();
        save(); render(); toast('Удалена');
      } else if (moveTo) {
        var target = state.columns.find(function(c){ return c.id === moveTo; });
        if (!target) return;
        col.cards = col.cards.filter(function(c){ return c.id !== card.id; });
        card.columnEnteredAt = Date.now();
        afterColumnChange(card, target);
        target.cards.push(card);
        save(); render();
        toast('Перемещено в «' + target.title + '»');
      } else if (setStatus) {
        card.status = setStatus;
        if (setStatus === 'done') { if (!card.doneAt) card.doneAt = Date.now(); } else card.doneAt = 0;
        card.updatedAt = Date.now();
        save(); render();
        toast('Статус: ' + STATUSES[setStatus].name);
      }
    });
    positionPopup(popup, anchorEl);
    openPopup = popup;
  }

  function addCardToDiary(card) {
    var k = todayKey();
    var e = ensureDiaryEntry(k);
    if (e.content && e.content.indexOf(card.title) !== -1) {
      openDayInDiary(k);
      toast('Уже упомянута в сегодняшней записи');
      return;
    }
    var time = new Date();
    var hh = String(time.getHours()).padStart(2,'0');
    var mm = String(time.getMinutes()).padStart(2,'0');
    var line = '\n\n📌 ' + card.title;
    if (card.from) line += ' (от ' + card.from + ')';
    if (card.due) line += ' · срок ' + formatDate(card.due);
    line += ' [' + hh + ':' + mm + ']';
    if (!e.content) {
      e.content = '📌 ' + card.title;
      if (card.from) e.content += ' (от ' + card.from + ')';
      if (card.due) e.content += ' · срок ' + formatDate(card.due);
      e.content += ' [' + hh + ':' + mm + ']';
    } else {
      e.content += line;
    }
    e.updatedAt = Date.now();
    save();
    openDayInDiary(k);
    toast('Записано в дневник за сегодня');
  }
  function openDayInDiary(k) {
    state.selectedDiaryDate = k;
    state.activeTab = 'diary';
    save();
    updateTabUI();
    renderDiary();
    if ($('diaryDateJump')) $('diaryDateJump').value = k;
  }

        state.columns.push({ id: uid('col'), title: t, color: c, wipLimit: 0, cards: [] });

      '<p style="font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-bottom:10px;">Максимум задач одновременно. 0 — без ограничения.</p>' +
      '<label>Лимит</label>' +

  function openSortDialog(col) {
    showModal('Сортировать задачи',
      '<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;">' +
      '<button class="tbtn" style="justify-content:flex-start;" data-sort="priority">По приоритету</button>' +
      '<button class="tbtn" style="justify-content:flex-start;" data-sort="status">По статусу</button>' +
      '<button class="tbtn" style="justify-content:flex-start;" data-sort="due">По сроку</button>' +
      '<button class="tbtn" style="justify-content:flex-start;" data-sort="taskdate">По дате задания</button>' +
      '<button class="tbtn" style="justify-content:flex-start;" data-sort="title">По алфавиту</button>' +
      '<button class="tbtn" style="justify-content:flex-start;" data-sort="created">По времени создания</button>' +
      '</div>',
      null, 'Отмена', function() {
      document.querySelectorAll('#modal [data-sort]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var type = btn.dataset.sort;
          if (type === 'priority') {
            var o = { high:0, medium:1, low:2, none:3 };
            col.cards.sort(function(a,b){ return (o[a.priority]||3) - (o[b.priority]||3); });
          } else if (type === 'status') {
            var order = { blocked:0, inprogress:1, open:2, paused:3, done:4 };
            col.cards.sort(function(a,b){ return (order[a.status]||2) - (order[b.status]||2); });
          } else if (type === 'due') {
            col.cards.sort(function(a,b) {
              if (!a.due && !b.due) return 0;
              if (!a.due) return 1;
              if (!b.due) return -1;
              return a.due.localeCompare(b.due);
            });
          } else if (type === 'taskdate') {
            col.cards.sort(function(a,b) {
              if (!a.taskDate && !b.taskDate) return 0;
              if (!a.taskDate) return 1;
              if (!b.taskDate) return -1;
              return a.taskDate.localeCompare(b.taskDate);
            });
          } else if (type === 'title') {
            col.cards.sort(function(a,b){ return a.title.localeCompare(b.title, 'ru'); });
          } else if (type === 'created') {
            col.cards.sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
          }
          save(); render(); closeModal(); toast('Отсортировано');
        });
      });
    });
  }
  function duplicateColumn(col) {
    var nc = JSON.parse(JSON.stringify(col));
    nc.id = uid('col');
    nc.title = col.title + ' (копия)';
    nc.cards.forEach(function(c){ c.id = uid('c'); c.checklist.forEach(function(it){ it.id = uid('cl'); }); });
    var idx = state.columns.indexOf(col);
    state.columns.splice(idx + 1, 0, nc);
    save(); render(); toast('Дублирована');
  }

  function renderChecklistEditor() {
    var el = $('mChecklistEditor');
    if (!el) return;
    el.innerHTML = '';
    editingChecklist.forEach(function(it, idx) {
      var row = document.createElement('div');
      row.className = 'cl-edit-item';
      row.dataset.idx = idx;
      var handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.textContent = '⋮⋮';
      handle.draggable = true;
      handle.title = 'Перетащи, чтобы изменить порядок';
      row.appendChild(handle);

      handle.addEventListener('dragstart', function(e) {
        dragCLIdx = idx;
        row.classList.add('cl-dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', 'cl-' + it.id);
      });
      handle.addEventListener('dragend', function() {
        dragCLIdx = null;
        document.querySelectorAll('#mChecklistEditor .cl-edit-item').forEach(function(r) {
          r.classList.remove('cl-dragging', 'cl-drop-above', 'cl-drop-below');
        });
      });
      row.addEventListener('dragover', function(e) {
        if (dragCLIdx === null) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        var rect = row.getBoundingClientRect();
        var isAbove = e.clientY < rect.top + rect.height / 2;
        document.querySelectorAll('#mChecklistEditor .cl-edit-item').forEach(function(r) {
          r.classList.remove('cl-drop-above', 'cl-drop-below');
        });
        row.classList.add(isAbove ? 'cl-drop-above' : 'cl-drop-below');
      });
      row.addEventListener('dragleave', function(e) {
        if (!row.contains(e.relatedTarget)) {
          row.classList.remove('cl-drop-above', 'cl-drop-below');
        }
      });
      row.addEventListener('drop', function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (dragCLIdx === null) return;
        var rect = row.getBoundingClientRect();
        var isAbove = e.clientY < rect.top + rect.height / 2;
        var from = dragCLIdx;
        var to = idx;
        document.querySelectorAll('#mChecklistEditor .cl-edit-item').forEach(function(r) {
          r.classList.remove('cl-dragging', 'cl-drop-above', 'cl-drop-below');
        });
        if (from === to) { dragCLIdx = null; return; }
        var item = editingChecklist[from];
        editingChecklist.splice(from, 1);
        var insertAt;
        if (from < to) insertAt = isAbove ? to - 1 : to;
        else insertAt = isAbove ? to : to + 1;
        editingChecklist.splice(insertAt, 0, item);
        dragCLIdx = null;
        renderChecklistEditor();
      });

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = it.done;
      cb.addEventListener('change', function() { it.done = cb.checked; updateChecklistProgress(); });
      row.appendChild(cb);

      var tx = document.createElement('input');
      tx.type = 'text';
      tx.value = it.text;
      tx.placeholder = 'Что нужно сделать?';
      tx.addEventListener('input', function() { it.text = tx.value; });
      tx.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          var newIt = { id: uid('cl'), text: '', done: false };
          editingChecklist.splice(idx + 1, 0, newIt);
          renderChecklistEditor();
          setTimeout(function() {
            var items = document.querySelectorAll('#mChecklistEditor .cl-edit-item input[type="text"]');
            if (items[idx + 1]) items[idx + 1].focus();
          }, 0);
        } else if (e.key === 'Backspace' && !tx.value && editingChecklist.length > 1) {
          e.preventDefault();
          editingChecklist.splice(idx, 1);
          renderChecklistEditor();
        }
      });
      row.appendChild(tx);

      var rm = document.createElement('button');
      rm.className = 'rm';
      rm.type = 'button';
      rm.textContent = '×';
      rm.title = 'Удалить';
      rm.addEventListener('click', function() {
        editingChecklist.splice(idx, 1);
        renderChecklistEditor();
      });
      row.appendChild(rm);
      el.appendChild(row);
    });
    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'cl-add-btn';
    addBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Добавить пункт';
    addBtn.addEventListener('click', function() {
      editingChecklist.push({ id: uid('cl'), text: '', done: false });
      renderChecklistEditor();
      var items = document.querySelectorAll('#mChecklistEditor .cl-edit-item input[type="text"]');
      if (items.length) items[items.length - 1].focus();
    });
    el.appendChild(addBtn);
    updateChecklistProgress();
  }

    var p = $('mChecklistProgress');

    p.style.display = 'flex';
    var done = editingChecklist.filter(function(it){ return it.done; }).length;
    var pct = editingChecklist.length ? (done / editingChecklist.length * 100) : 0;
    p.innerHTML = '<span>' + done + '/' + editingChecklist.length + '</span><div class="bar"><div class="fill" style="width:' + pct + '%"></div></div>';
  }

          var btn = e.target.closest('.prio-opt');
          if (!btn) return;
          picker.querySelectorAll('.prio-opt').forEach(function(b) { b.classList.toggle('on', b === btn); });
        });
      }
      var sp = $('mStatusPicker');
      if (sp) {
        sp.addEventListener('click', function(e) {
          var btn = e.target.closest('.status-opt');
          if (!btn) return;
          sp.querySelectorAll('.status-opt').forEach(function(b) {
            b.classList.remove('on'); b.style.color = ''; b.style.background = ''; b.style.borderColor = '';
          });
          btn.classList.add('on');
          var key = btn.dataset.s;
          var st = STATUSES[key];
          btn.style.color = st.color;
          btn.style.background = st.bg;
          btn.style.borderColor = st.color;
        });
      }
      var t = $('mCardTitle');
      if (t) t.focus();
    }, 60);
  }

  function showCardModal(title, bodyHtml, buttons) {
    var modal = $('modal');
    var modalBg = $('modalBg');
    var btnsHtml = buttons.map(function(b) {
      return '<button class="' + b.cls + '" data-action="' + b.action + '">' + b.label + '</button>';
    }).join('');
    modal.innerHTML = '<h3>' + title + '</h3><div>' + bodyHtml + '</div><div class="actions">' + btnsHtml + '</div>';
    modalBg.classList.add('show');
    modal.querySelectorAll('.actions button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var action = btn.dataset.action;
        if (action === 'cancel') closeModal();
        else if (action === 'todiary') {
          if (!editingState || !editingState.isEdit) { toast('Сначала сохраните'); return; }
          var col = state.columns.find(function(c){ return c.id === editingState.colId; });
          if (!col) return;
          var card = col.cards.find(function(c){ return c.id === editingState.cardId; });
          closeModal();
          if (card) addCardToDiary(card);
        }
        else if (action === 'delete') {
          if (!editingState) { closeModal(); return; }
          var colId = editingState.colId;
          var cardId = editingState.cardId;
          closeModal();
          handleCardDeleteWithConfirm(colId, cardId);
        }
        else if (action === 'save') saveCard();
      });
    });
    modal.onkeydown = function(e) {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON' && e.target.type !== 'checkbox') {
        e.preventDefault(); saveCard();
      } else if (e.key === 'Escape') closeModal();
    };
  }

  async function handleCardDeleteWithConfirm(colId, cardId) {
    var col = state.columns.find(function(c){ return c.id === colId; });
    if (!col) return;
    var card = col.cards.find(function(c){ return c.id === cardId; });
    if (!card) return;
    var ok = await confirmDialog(
      'Удалить задачу <b>«' + escapeHtml(card.title) + '»</b>?',
      { title: 'Удалить задачу', okLabel: 'Удалить' }
    );
    if (!ok) { openCardModal(colId, cardId); return; }
    var col2 = state.columns.find(function(c){ return c.id === colId; });
    if (!col2) return;
    col2.cards = col2.cards.filter(function(c){ return c.id !== cardId; });
    if (state.pomodoro.cardId === cardId) stopPomodoro();
    save(); render(); toast('Удалена');
  }

  function saveCard() {
    var title = ($('mCardTitle').value || '').trim();
    if (!title) { toast('Введите заголовок'); $('mCardTitle').focus(); return; }
    var desc = $('mCardDesc').value.trim();
    var tags = parseTags($('mCardTags').value);
    var due = $('mCardDue').value;
    var fromVal = ($('mCardFrom').value || '').trim();
    var taskDateVal = $('mCardTaskDate').value || '';
    var pBtn = document.querySelector('#mPrioPicker .prio-opt.on');
    var prio = pBtn ? pBtn.dataset.p : 'none';
    var sBtn = document.querySelector('#mStatusPicker .status-opt.on');
    var statusVal = sBtn ? sBtn.dataset.s : 'open';
    var cleanCl = editingChecklist.filter(function(it){ return it.text.trim(); });

    var col = state.columns.find(function(c){ return c.id === editingState.colId; });
    if (!col) { closeModal(); return; }

    if (editingState && editingState.isEdit) {
      var card = col.cards.find(function(c){ return c.id === editingState.cardId; });
      if (!card) { closeModal(); return; }
      card.title = title; card.description = desc; card.tags = tags;
      card.priority = prio; card.due = due;
      card.from = fromVal; card.taskDate = taskDateVal;
      card.status = statusVal; card.image = editingImage;
      if (statusVal === 'done') { if (!card.doneAt) card.doneAt = Date.now(); } else card.doneAt = 0;
      card.checklist = cleanCl;
      card.updatedAt = Date.now();
    } else {
      col.cards.push({
        id: uid('c'), title: title, description: desc,
        tags: tags, priority: prio, due: due,
        from: fromVal, taskDate: taskDateVal,
        status: statusVal, image: editingImage,
        checklist: cleanCl, pomoSeconds: 0,
        createdAt: Date.now(), columnEnteredAt: Date.now(), updatedAt: Date.now()
      });
    }
    save(); render();
    closeModal();
    toast((editingState && editingState.isEdit) ? 'Обновлено' : 'Создано');
  }

  function showModal(title, bodyHtml, onOk, cancelText, onAfter) {
    var modal = $('modal');
    var modalBg = $('modalBg');
    var buttons = '';
    if (onOk) buttons += '<button class="primary" id="modalOk">ОК</button>';
    buttons += '<button id="modalCancel">' + (cancelText || (onOk ? 'Отмена' : 'Закрыть')) + '</button>';
    modal.innerHTML = '<h3>' + title + '</h3><div>' + bodyHtml + '</div><div class="actions">' + buttons + '</div>';
    modalBg.classList.add('show');
    var fi = modal.querySelector('input, textarea');
    if (fi) setTimeout(function() { fi.focus(); fi.select && fi.select(); }, 60);
    $('modalCancel').onclick = closeModal;
    if (onOk) {
      $('modalOk').onclick = function() { onOk(); closeModal(); };
      modal.onkeydown = function(e) {
        if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
          e.preventDefault(); onOk(); closeModal();
        }
      };
    }
    if (onAfter) setTimeout(onAfter, 30);
  }
  function closeModal() {
    $('modalBg').classList.remove('show');
    $('modal').onkeydown = null;
    $('modal').classList.remove('dragover');
    editingState = null;
    editingImage = null;
    editingChecklist = [];

  }

  });

  /* ============================================================
     POMODORO
     ============================================================ */
  var pomoTimer = null;
  function startPomodoro(card) {
    if (state.pomodoro.cardId) stopPomodoro();
    state.pomodoro.cardId = card.id;
    state.pomodoro.startedAt = Date.now();
    state.pomodoro.endsAt = Date.now() + POMO_DURATION;
    save(); render(); updatePomoStatus();
    toast('🍅 Помодоро запущен на 25 минут');
    if (pomoTimer) clearInterval(pomoTimer);
    pomoTimer = setInterval(tickPomodoro, 1000);
  }
  function stopPomodoro() {
    if (!state.pomodoro.cardId) return;
    var card = findCardById(state.pomodoro.cardId);
    if (card) {
      var elapsed = Math.floor((Date.now() - state.pomodoro.startedAt) / 1000);
      if (elapsed > 0) card.pomoSeconds = (card.pomoSeconds || 0) + elapsed;
    }
    state.pomodoro.cardId = null;
    state.pomodoro.startedAt = 0;
    state.pomodoro.endsAt = 0;
    if (pomoTimer) { clearInterval(pomoTimer); pomoTimer = null; }
    save(); render(); updatePomoStatus();
    toast('Помодоро остановлен');
  }
  function tickPomodoro() {
    if (!state.pomodoro.cardId) { if (pomoTimer) clearInterval(pomoTimer); pomoTimer = null; return; }
    if (Date.now() >= state.pomodoro.endsAt) {
      var card = findCardById(state.pomodoro.cardId);
      if (card) card.pomoSeconds = (card.pomoSeconds || 0) + Math.round(POMO_DURATION / 1000);
      state.pomodoro.cardId = null;
      state.pomodoro.startedAt = 0;
      state.pomodoro.endsAt = 0;
      if (pomoTimer) { clearInterval(pomoTimer); pomoTimer = null; }
      save(); render(); updatePomoStatus();
      toast('🍅 Помодоро завершён! Отдохни 5 минут');
      return;
    }
    var el = document.querySelector('.card-pomo[data-pomo-for="' + state.pomodoro.cardId + '"]');
    if (el) {
      var card = findCardById(state.pomodoro.cardId);
      if (card) el.textContent = '🍅 ' + formatPomoTime(card.pomoSeconds, true);
    }
    updatePomoStatus();
  }
  function findCardById(id) {
    for (var i = 0; i < state.columns.length; i++) {
      var c = state.columns[i].cards.find(function(c){ return c.id === id; });
      if (c) return c;
    }
    return null;
  }
  function updatePomoStatus() {
    var el = $('statPomo');
    if (!state.pomodoro.cardId) { el.style.display = 'none'; return; }
    var rem = Math.max(0, Math.floor((state.pomodoro.endsAt - Date.now()) / 1000));
    var m = Math.floor(rem / 60);
    var s = rem % 60;
    el.style.display = '';
    el.textContent = '🍅 ' + m + ':' + String(s).padStart(2, '0');
  }
  function resumePomodoro() {
    if (state.pomodoro.cardId && state.pomodoro.endsAt > Date.now()) {
      if (pomoTimer) clearInterval(pomoTimer);
      pomoTimer = setInterval(tickPomodoro, 1000);
      tickPomodoro();
    } else if (state.pomodoro.cardId && state.pomodoro.endsAt <= Date.now()) {
      var card = findCardById(state.pomodoro.cardId);
      if (card) card.pomoSeconds = (card.pomoSeconds || 0) + Math.round(POMO_DURATION / 1000);
      state.pomodoro.cardId = null;
      state.pomodoro.endsAt = 0;
      save();
    }
  }

  /* ============================================================
     STATS
     ============================================================ */
  function renderStats() {
    if (state.kanbanView !== 'stats') return; // вкладка «Обзор» отключена
    var view = $('statsView');
    if (!view) return;
    view.innerHTML = '';
    var inner = document.createElement('div');
    inner.className = 'stats-inner';

    var total = 0, done = 0, inProgress = 0, overdueCount = 0;
    var byPriority = { high: 0, medium: 0, low: 0, none: 0 };
    var byStatus = { open: 0, inprogress: 0, paused: 0, blocked: 0, done: 0 };
    var overdue = [];
    var today = new Date(); today.setHours(0,0,0,0);
    var lastColIdx = state.columns.length - 1;
    var lastColIsDone = state.columns[lastColIdx] &&
      /done|готово|выполнено|завершено/i.test(state.columns[lastColIdx].title);

    state.columns.forEach(function(col, colIdx) {
      col.cards.forEach(function(card) {
        total++;
        if (lastColIsDone && colIdx === lastColIdx) done++;
        else inProgress++;
        byPriority[card.priority || 'none']++;
        if (STATUSES[card.status]) byStatus[card.status]++;
        if (card.due) {
          var d = new Date(card.due + 'T00:00:00');
          if (d < today && !(lastColIsDone && colIdx === lastColIdx)) {
            overdueCount++;
            overdue.push({ card: card, col: col, days: Math.round((today - d) / 86400000) });
          }
        }
      });
    });

    var cards = document.createElement('div');
    cards.className = 'stats-cards';
    [
      { h: 'Всего задач', v: total, cls: '' },
      { h: 'Готово', v: done, cls: 'ok', sub: total ? Math.round(done/total*100) + '%' : '—' },
      { h: 'В работе', v: inProgress, cls: 'accent' },
      { h: 'Просрочено', v: overdueCount, cls: overdueCount > 0 ? 'danger' : '' }
    ].forEach(function(s) {
      var card = document.createElement('div');
      card.className = 'stat-card';
      card.innerHTML = '<h4>' + s.h + '</h4><div class="stat-big ' + s.cls + '">' + s.v + '</div>' +
        (s.sub ? '<div class="stat-sub">' + s.sub + '</div>' : '');
      cards.appendChild(card);
    });
    inner.appendChild(cards);

    if (state.columns.length) {
      var panel = document.createElement('div');
      panel.className = 'stats-panel';
      panel.innerHTML = '<h3>Задачи по колонкам</h3>';
      var chart = document.createElement('div');
      chart.className = 'bar-chart';
      var max = Math.max.apply(null, state.columns.map(function(c){ return c.cards.length; }).concat([1]));
      state.columns.forEach(function(col) {
        var row = document.createElement('div');
        row.className = 'bar-row';
        var pct = max ? (col.cards.length / max * 100) : 0;
        row.innerHTML =
          '<div class="bar-label"><span class="col-dot" style="background:' + col.color + '"></span>' + escapeHtml(col.title) + '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + col.color + '"></div></div>' +
          '<div class="bar-count">' + col.cards.length + '</div>';
        chart.appendChild(row);
      });
      panel.appendChild(chart);
      inner.appendChild(panel);
    }

    if (total > 0) {
      var panelS = document.createElement('div');
      panelS.className = 'stats-panel';
      panelS.innerHTML = '<h3>Распределение по статусам</h3>';
      var segments = [], acc = 0;
      Object.keys(STATUSES).forEach(function(k) {
        if (byStatus[k] > 0) {
          var pct = byStatus[k] / total * 100;
          segments.push(STATUSES[k].color + ' ' + acc + '% ' + (acc + pct) + '%');
          acc += pct;
        }
      });
      var donutBg = segments.length ? 'conic-gradient(' + segments.join(', ') + ')' : 'var(--hover)';
      var chart2 = document.createElement('div');
      chart2.className = 'priority-chart';
      chart2.innerHTML =
        '<div class="donut-wrap"><div class="donut" style="background:' + donutBg + '"></div>' +
          '<div class="donut-hole"><div class="total">' + total + '</div><div class="lbl">задач</div></div></div>' +
        '<div class="legend">' +
          Object.keys(STATUSES).filter(function(k){ return byStatus[k] > 0; }).map(function(k) {
            return '<div class="legend-item">' +
              '<span class="legend-color" style="background:' + STATUSES[k].color + '"></span>' +
              '<span class="legend-label">' + escapeHtml(STATUSES[k].name) + '</span>' +
              '<span class="legend-count">' + byStatus[k] + '</span></div>';
          }).join('') +
        '</div>';
      panelS.appendChild(chart2);
      inner.appendChild(panelS);
    }

    if (total > 0) {
      var panel2 = document.createElement('div');
      panel2.className = 'stats-panel';
      panel2.innerHTML = '<h3>Распределение по приоритетам</h3>';
      var pColors = { high: '#ff3b30', medium: '#ff9500', low: '#34c759', none: '#c7c7cc' };
      var segments2 = [], acc2 = 0;
      ['high','medium','low','none'].forEach(function(p) {
        if (byPriority[p] > 0) {
          var pct = byPriority[p] / total * 100;
          segments2.push(pColors[p] + ' ' + acc2 + '% ' + (acc2 + pct) + '%');
          acc2 += pct;
        }
      });
      var donutBg2 = segments2.length ? 'conic-gradient(' + segments2.join(', ') + ')' : 'var(--hover)';
      var prioChart = document.createElement('div');
      prioChart.className = 'priority-chart';
      prioChart.innerHTML =
        '<div class="donut-wrap"><div class="donut" style="background:' + donutBg2 + '"></div>' +
          '<div class="donut-hole"><div class="total">' + total + '</div><div class="lbl">задач</div></div></div>' +
        '<div class="legend">' +
          ['high','medium','low','none'].filter(function(p){ return byPriority[p] > 0; }).map(function(p) {
            return '<div class="legend-item">' +
              '<span class="legend-color" style="background:' + pColors[p] + '"></span>' +
              '<span class="legend-label">' + PRIORITY_NAMES[p] + '</span>' +
              '<span class="legend-count">' + byPriority[p] + '</span></div>';

      panel2.appendChild(prioChart);
      inner.appendChild(panel2);
    }

    if (overdue.length > 0) {
      overdue.sort(function(a, b) { return b.days - a.days; });
      var panel3 = document.createElement('div');
      panel3.className = 'stats-panel';
      panel3.innerHTML = '<h3>Просроченные (' + overdue.length + ')</h3>';
      var list = document.createElement('div');
      list.className = 'overdue-list';
      overdue.slice(0, 10).forEach(function(item) {
        var row = document.createElement('button');
        row.className = 'overdue-item';
        var daysLabel = item.days === 1 ? '1 день' : item.days < 5 ? item.days + ' дня' : item.days + ' дней';
        row.innerHTML = '<span class="title">' + escapeHtml(item.card.title) + '</span>' +
          '<span class="days">−' + daysLabel + '</span>';
        row.addEventListener('click', function() { openCardModal(item.col.id, item.card.id); });
        list.appendChild(row);
      });
      if (overdue.length > 10) {
        var m = document.createElement('div');
        m.className = 'stats-empty';
        m.textContent = '…и ещё ' + (overdue.length - 10);
        list.appendChild(m);
      }
      panel3.appendChild(list);
      inner.appendChild(panel3);
    }
    if (total === 0) {
      var empty = document.createElement('div');
      empty.className = 'stats-panel stats-empty';
      empty.textContent = 'Задач пока нет';
      inner.appendChild(empty);
    }
    view.appendChild(inner);
  }

  /* ============================================================
     MAP VIEW
     ============================================================ */
  var mapState = {
    hoveredCardId: null,
    hoveredHubKey: null,
    animStart: performance.now(),
    tooltipRect: null
  };
  var mapCache = { cards: [], hubs: [], cx: 0, cy: 0, w: 0, h: 0 };
  var mapLayoutCache = null;
  var mapRipples = [];
  var mapRafId = null;

  function resetMapAnimation() {
    mapState.animStart = performance.now();
  }

  var DUE_GROUPS = [['overdue', 'Просрочено', '#ff3b30'], ['today', 'Сегодня', '#ff9500'], ['week', 'На неделе', '#007aff'], ['later', 'Позже', '#34c759'], ['none', 'Без срока', '#8e8e93']];
  function dueBucket(card) {
    if (!card.due) return 'none';
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var diff = Math.round((new Date(card.due + 'T00:00:00') - t) / 86400000);
    return diff < 0 ? 'overdue' : diff === 0 ? 'today' : diff <= 7 ? 'week' : 'later';
  }
  function computeMapLayout(w, h) {
    var cards = [], hubs = [];
    var cx = w / 2, cy = h / 2;
    var groups;

    if (state.mapGrouping === 'priority') {
      groups = ['high', 'medium', 'low', 'none'].map(function(k) {
        return { key: k, name: PRIORITY_NAMES[k] || 'Без приоритета', color: PRIORITY_COLORS[k] || '#8e8e93', cards: [] };
      });
    } else if (state.mapGrouping === 'due') {
      groups = DUE_GROUPS.map(function(g) { return { key: g[0], name: g[1], color: g[2], cards: [] }; });
    } else {
      groups = Object.keys(STATUSES).map(function(k) {
        return { key: k, name: STATUSES[k].name, color: STATUSES[k].color, cards: [] };
      });
    }

    state.columns.forEach(function(col) {
      col.cards.forEach(function(card) {
        if (!cardMatchesFilters(card)) return;
        if (state.mapGrouping === 'due' && card.status === 'done') return;
        var key = state.mapGrouping === 'priority'
          ? (card.priority || 'none')
          : state.mapGrouping === 'due' ? dueBucket(card) : (card.status || 'open');
        var g = groups.find(function(x) { return x.key === key; });
        if (g) g.cards.push({ card: card, col: col });
      });
    });

    groups = groups.filter(function(g) { return g.cards.length > 0; });
    var N = groups.length;
    if (N === 0) return { cards: [], hubs: [], cx: cx, cy: cy };

    var catRingR = Math.min(w, h) * (N <= 2 ? 0.22 : 0.28);
    var catRadius = Math.max(34, Math.min(56, Math.min(w, h) * 0.058));
    var taskMinR = catRadius + 22;
    var taskMaxR = Math.min(w, h) * (N <= 3 ? 0.18 : 0.15);
    if (taskMaxR < taskMinR + 20) taskMaxR = taskMinR + 40;

    groups.forEach(function(g, i) {
      var a = -Math.PI / 2 + (i / N) * Math.PI * 2;
      var hx = cx + Math.cos(a) * catRingR;
      var hy = cy + Math.sin(a) * catRingR;
      g.x = hx; g.y = hy; g.angle = a; g.radius = catRadius; g.popIndex = i;
      hubs.push(g);

      var M = g.cards.length;
      var cardList = g.cards.slice();
      cardList.sort(function(a, b) {
        var pa = a.card.checklist && a.card.checklist.length ? a.card.checklist.filter(function(x){return x.done;}).length / a.card.checklist.length : 0;
        var pb = b.card.checklist && b.card.checklist.length ? b.card.checklist.filter(function(x){return x.done;}).length / b.card.checklist.length : 0;
        return pb - pa;
      });

      var goldenAngle = Math.PI * (3 - Math.sqrt(5));
      for (var j = 0; j < M; j++) {
        var da = j * goldenAngle + i * 1.13;
        var ringP = M === 1 ? 0 : Math.sqrt((j + 0.5) / M);
        var tr = taskMinR + ringP * (taskMaxR - taskMinR);
        var tx = hx + Math.cos(da) * tr;
        var ty = hy + Math.sin(da) * tr;

        var cl = cardList[j].card.checklist || [];
        var done = cl.filter(function(x){return x.done;}).length;
        var prog = cl.length ? done / cl.length : 0;
        var size = 5 + prog * 5 + Math.min(5, cl.length * 0.6);
        if (cardList[j].card.image) size += 2;
        if (isNaN(size) || size < 4) size = 6;

        var taskColor;
        if (state.mapGrouping === 'priority') {
          taskColor = STATUSES[cardList[j].card.status]
            ? STATUSES[cardList[j].card.status].color
            : '#8e8e93';
        } else {
          taskColor = PRIORITY_COLORS[cardList[j].card.priority] || '#8e8e93';
        }

        cards.push({
          card: cardList[j].card,
          col: cardList[j].col,
          x: tx, y: ty,
          hubX: hx, hubY: hy,
          hubKey: g.key,
          hubColor: g.color,
          taskColor: taskColor,
          size: size,
          progress: prog,
          overdue: cardList[j].card.status !== 'done' && dueStatus(cardList[j].card.due) === 'overdue',
          popIndex: cards.length
        });
      }
    });

    return { cards: cards, hubs: hubs, cx: cx, cy: cy };
  }

  function sizeMapCanvas() {
    var canvas = $('mapCanvas');
    if (!canvas) return null;
    var wrap = canvas.parentElement;
    var w = wrap.clientWidth;
    var h = wrap.clientHeight;
    if (w <= 0 || h <= 0) return null;
    var dpr = window.devicePixelRatio || 1;
    var pw = Math.round(w * dpr), ph = Math.round(h * dpr);
    if (canvas.width !== pw || canvas.height !== ph) {
      canvas.width = pw;
      canvas.height = ph;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
    }
    return { w: w, h: h, dpr: dpr };
  }

  function drawMapFrame(now) {
    var size = sizeMapCanvas();
    if (!size) return;
    var w = size.w, h = size.h, dpr = size.dpr;
    var canvas = $('mapCanvas');
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var lkey = w + 'x' + h + '|' + state.mapGrouping + '|' + mapRev;
    if (!mapLayoutCache || mapLayoutCache.key !== lkey) mapLayoutCache = { key: lkey, layout: computeMapLayout(w, h) };
    var layout = mapLayoutCache.layout;
    mapCache.cards = layout.cards;
    mapCache.hubs = layout.hubs;
    mapCache.cx = layout.cx;
    mapCache.cy = layout.cy;
    mapCache.w = w;
    mapCache.h = h;

    var t = now / 1000;
    var animElapsed = now - mapState.animStart;
    var animP = Math.max(0, Math.min(1, animElapsed / 700));
    var ease = Math.max(0, 1 - Math.pow(1 - animP, 3));

    function popEaseAt(popIndex, staggerMs, durMs) {
      var d = Math.min(360, (popIndex || 0) * staggerMs);
      var p = Math.max(0, Math.min(1, (animElapsed - d) / durMs));
      return Math.max(0, 1 - Math.pow(1 - p, 3));
    }
    function phaseFor(id) {
      var h = 0;
      for (var k = 0; k < id.length; k++) h = (h * 31 + id.charCodeAt(k)) % 10000;
      return (h / 10000) * Math.PI * 2;
    }


    if (layout.hubs.length === 0) {
      var emptyEl = document.querySelector('.map-empty');
      if (!emptyEl) {
        emptyEl = document.createElement('div');
        emptyEl.className = 'map-empty';
        emptyEl.innerHTML =
          '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15c1 1 5 1 6 0"/></svg>' +
          '<div>Пока нечего показывать на карте</div>' +
          '<div style="font-size:11.5px;opacity:.75;">Создай задачи — они появятся здесь в виде карты</div>';
        $('mapView').appendChild(emptyEl);
      }
      return;
    } else {
      var emptyEl2 = document.querySelector('.map-empty');
      if (emptyEl2) emptyEl2.remove();
    }

    // 1. Connection lines
    layout.cards.forEach(function(c) {
      if (c.phase === undefined) c.phase = phaseFor(c.card.id);
      var lEase = popEaseAt(c.popIndex, 22, 480);
      var midX = c.hubX + (c.x - c.hubX) * 0.5;
      var midY = c.hubY + (c.y - c.hubY) * 0.5;
      var perpX = -(c.y - c.hubY) * 0.12;
      var perpY = (c.x - c.hubX) * 0.12;

      ctx.beginPath();
      ctx.strokeStyle = hexA(c.hubColor, 0.22 * lEase);
      ctx.lineWidth = 1.2;
      ctx.moveTo(c.hubX, c.hubY);
      ctx.quadraticCurveTo(midX + perpX, midY + perpY, c.x, c.y);
      ctx.stroke();

      var fu = (t * 0.22 + c.phase / (Math.PI * 2)) % 1, fv = 1 - fu;
      var fx = fv * fv * c.hubX + 2 * fv * fu * (midX + perpX) + fu * fu * c.x;
      var fy = fv * fv * c.hubY + 2 * fv * fu * (midY + perpY) + fu * fu * c.y;
      ctx.beginPath();
      ctx.fillStyle = hexA(c.hubColor, 0.6 * lEase * Math.sin(fu * Math.PI));
      ctx.arc(fx, fy, 1.9, 0, Math.PI * 2);
      ctx.fill();
    });

    // 2. Hubs
    layout.hubs.forEach(function(hub) {
      var hEase = popEaseAt(hub.popIndex, 60, 520);
      var pulse = 1 + 0.045 * Math.sin(t * 1.5 + hub.angle * 1.8);
      var r = hub.radius * pulse * hEase;

      var grad = ctx.createRadialGradient(hub.x, hub.y, 0, hub.x, hub.y, r * 2.6);
      grad.addColorStop(0, hexA(hub.color, 0.34 * hEase));
      grad.addColorStop(0.55, hexA(hub.color, 0.08 * hEase));
      grad.addColorStop(1, hexA(hub.color, 0));
      ctx.beginPath();
      ctx.fillStyle = grad;
      ctx.arc(hub.x, hub.y, r * 2.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = hexA(hub.color, 0.92 * hEase);
      ctx.arc(hub.x, hub.y, r, 0, Math.PI * 2);
      ctx.fill();

      // Soft inner ring
      ctx.beginPath();
      ctx.strokeStyle = hexA('#ffffff', 0.35 * hEase);
      ctx.lineWidth = 2;
      ctx.arc(hub.x, hub.y, Math.max(0, r - 3), 0, Math.PI * 2);
      ctx.stroke();

      if (hEase > 0.45) {
        var textA = Math.max(0, Math.min(1, (hEase - 0.45) / 0.55));

        ctx.save();
        ctx.globalAlpha = textA;
        ctx.fillStyle = '#fff';
        var fontSize = Math.max(14, Math.round(r * 0.72));
        ctx.font = '700 ' + fontSize + 'px ' + mapFontFamily();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(hub.cards.length), hub.x, hub.y + 1);
        ctx.restore();

        // Label
        var labelA = textA;
        ctx.save();
        ctx.globalAlpha = labelA;
        ctx.font = '600 12px ' + mapFontFamily();
        var txt = hub.name;
        var m = ctx.measureText(txt);
        var padX = 9, boxH = 22;
        var boxW = m.width + padX * 2;
        // Плашка отодвигается на половину своего размера вдоль направления — так она не заходит под круг
        var ldx = Math.cos(hub.angle), ldy = Math.sin(hub.angle);
        var labelD = hub.radius * 1.06 + 12 + Math.abs(ldx) * boxW / 2 + Math.abs(ldy) * boxH / 2;
        var lx = hub.x + ldx * labelD;
        var ly = hub.y + ldy * labelD;
        var bx = lx - boxW / 2, by = ly - boxH / 2;

        // Adjust if outside canvas
        if (bx < 6) bx = 6;
        if (bx + boxW > w - 6) bx = w - boxW - 6;
        if (by < 6) by = 6;
        if (by + boxH > h - 6) by = h - boxH - 6;
        var lcx = bx + boxW / 2, lcy = by + boxH / 2;

        roundRect(ctx, bx, by, boxW, boxH, 11);
        ctx.fillStyle = hexA(hub.color, 0.12);
        ctx.fill();
        ctx.strokeStyle = hexA(hub.color, 0.35);
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = hub.color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(txt, lcx, lcy);
        ctx.restore();
      }
    });

    // 3. Task dots
    layout.cards.forEach(function(c) {
      var cEase = popEaseAt(c.popIndex, 22, 480);
      var isHovered = mapState.hoveredCardId === c.card.id;
      var phase = c.phase;
      var breathe = 1 + 0.09 * Math.sin(t * 2.1 + phase);
      var bob = Math.sin(t * 1.6 + phase) * 1.6 * cEase;
      var cx = c.x, cy = c.y + bob;
      var r = c.size * cEase * breathe * (isHovered ? 1.55 : 1);

      if (isHovered) {
        var g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 4.5);
        g2.addColorStop(0, hexA(c.taskColor, 0.6));
        g2.addColorStop(0.5, hexA(c.taskColor, 0.2));
        g2.addColorStop(1, hexA(c.taskColor, 0));
        ctx.beginPath();
        ctx.fillStyle = g2;
        ctx.arc(cx, cy, r * 4.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Progress ring
      if (c.progress > 0 && c.progress < 1) {
        ctx.beginPath();
        ctx.strokeStyle = hexA(c.hubColor, 0.28 * cEase);
        ctx.lineWidth = 2;
        ctx.arc(cx, cy, r + 3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.strokeStyle = hexA(c.hubColor, 0.95 * cEase);
        ctx.lineWidth = 2;
        ctx.arc(cx, cy, r + 3, -Math.PI / 2, -Math.PI / 2 + c.progress * Math.PI * 2);
        ctx.stroke();
      }

      if (c.overdue) {
        var pulseO = 0.55 + 0.45 * Math.sin(t * 3.2 + c.phase);
        ctx.beginPath();
        ctx.strokeStyle = hexA('#ff3b30', 0.6 * cEase * pulseO);
        ctx.lineWidth = 2;
        ctx.arc(cx, cy, r + 7 + pulseO * 2, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.fillStyle = hexA(c.taskColor, 0.95 * cEase);
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = hexA('#ffffff', 0.45 * cEase);
      ctx.arc(cx - r * 0.28, cy - r * 0.28, r * 0.32, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.strokeStyle = hexA('#000000', 0.12 * cEase);
      ctx.lineWidth = 1;
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
    });

    // Волны от клика
    if (mapRipples.length) {
      mapRipples = mapRipples.filter(function(rp) { return now - rp.t0 < 700; });
      mapRipples.forEach(function(rp) {
        var pr = Math.max(0, (now - rp.t0) / 700), er = 1 - Math.pow(1 - pr, 3);
        ctx.beginPath();
        ctx.strokeStyle = hexA(rp.color, 0.5 * (1 - pr));
        ctx.lineWidth = 0.6 + 2.6 * (1 - pr);
        ctx.arc(rp.x, rp.y, 12 + er * 86, 0, Math.PI * 2);
        ctx.stroke();
      });
    }

    // 4. Center label
    if (ease > 0.3) {
      var ca = Math.max(0, Math.min(1, (ease - 0.3) / 0.7));
      ctx.save();
      ctx.globalAlpha = ca;
      var cs = getComputedStyle(document.documentElement);
      var textColor = cs.getPropertyValue('--text').trim() || '#1d1d1f';
      var dimColor = cs.getPropertyValue('--text-dim').trim() || '#86868b';
      ctx.fillStyle = textColor;
      ctx.font = '700 13px ' + mapFontFamily();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(state.mapGrouping === 'due' ? 'Что горит' : 'Карта задач', layout.cx, layout.cy - 8);
      ctx.fillStyle = dimColor;
      ctx.font = '500 11.5px ' + mapFontFamily();
      var nOver = layout.cards.filter(function(cc) { return cc.overdue; }).length;
      var subtitle = state.mapGrouping === 'due'
        ? (nOver ? nOver + ' просрочено' : 'просрочек нет') + ' · ' + layout.cards.length + ' ' + pluralTasks(layout.cards.length)
        : layout.cards.length + ' ' + pluralTasks(layout.cards.length) + ' · по ' +
          (state.mapGrouping === 'priority' ? 'приоритету' : 'статусу') + (nOver ? ' · ' + nOver + ' просрочено' : '');
      ctx.fillText(subtitle, layout.cx, layout.cy + 10);
      ctx.restore();
    }
  }

  function mapLoop(now) {
    if (state.kanbanView !== 'map' || state.activeTab !== 'kanban') {
      mapRafId = null;
      return;
    }
    try { drawMapFrame(now); } catch (err) { console.error('Map draw error (frame skipped):', err); }
    mapRafId = requestAnimationFrame(mapLoop);
  }
  function startMapLoop() {
    if (mapRafId) return;
    mapRafId = requestAnimationFrame(mapLoop);
  }
  function stopMapLoop() {
    if (mapRafId) { cancelAnimationFrame(mapRafId); mapRafId = null; }
    var tt = $('mapTooltip');
    if (tt) tt.classList.remove('show');
    mapState.hoveredCardId = null;
    mapState.hoveredHubKey = null;
  }

  function findMapTaskAt(mx, my) {
    for (var i = mapCache.cards.length - 1; i >= 0; i--) {
      var c = mapCache.cards[i];
      var dx = mx - c.x, dy = my - c.y;
      var r = c.size + 8;
      if (dx * dx + dy * dy < r * r) return c;
    }
    return null;
  }
  function findMapHubAt(mx, my) {
    for (var i = 0; i < mapCache.hubs.length; i++) {
      var hh = mapCache.hubs[i];
      var dx = mx - hh.x, dy = my - hh.y;
      if (dx * dx + dy * dy < hh.radius * hh.radius) return hh;
    }
    return null;
  }

  function updateMapTooltip(mx, my) {
    var tt = $('mapTooltip');
    if (!tt) return;
    var canvas = $('mapCanvas');
    if (!canvas) return;
    var rect = canvas.getBoundingClientRect();
    var containerRect = canvas.parentElement.getBoundingClientRect();

    var html = '';
    if (mapState.hoveredCardId) {
      var c = mapCache.cards.find(function(x) { return x.card.id === mapState.hoveredCardId; });
      if (!c) { tt.classList.remove('show'); return; }
      var card = c.card;
      var meta = [];
      if (STATUSES[card.status]) meta.push('<span>' + escapeHtml(STATUSES[card.status].name) + '</span>');
      if (card.priority && card.priority !== 'none') meta.push('<span>' + escapeHtml(PRIORITY_NAMES[card.priority]) + '</span>');
      var cl = card.checklist || [];
      if (cl.length) {
        var d = cl.filter(function(x){return x.done;}).length;
        meta.push('<span>' + d + '/' + cl.length + '</span>');
      }
      if (card.due) meta.push('<span>' + escapeHtml(formatDate(card.due)) + '</span>');
      if (card.from) meta.push('<span>' + escapeHtml(card.from) + '</span>');
      html = '<div class="tt-title">' + escapeHtml(card.title) + '</div>' +
        (meta.length ? '<div class="tt-meta">' + meta.join('') + '</div>' : '');
    } else if (mapState.hoveredHubKey) {
      var hub = mapCache.hubs.find(function(x) { return x.key === mapState.hoveredHubKey; });
      if (!hub) { tt.classList.remove('show'); return; }
      html = '<div class="tt-title">' + escapeHtml(hub.name) + '</div>' +
        '<div class="tt-meta"><span>' + hub.cards.length + ' ' + pluralTasks(hub.cards.length) + '</span>' +
        (state.mapGrouping === 'due' ? '' : '<span>клик — фильтр</span>') + '</div>';
    } else {
      tt.classList.remove('show');
      return;
    }

    tt.innerHTML = html;
    tt.classList.add('show');
    var tw = tt.offsetWidth, th = tt.offsetHeight;
    var lx = mx + 16, ly = my + 16;
    if (lx + tw > containerRect.width - 8) lx = mx - tw - 16;
    if (ly + th > containerRect.height - 8) ly = my - th - 16;
    tt.style.left = lx + 'px';
    tt.style.top = ly + 'px';
  }

  // Canvas events
  var mapCanvas = $('mapCanvas');
  if (mapCanvas) {
    mapCanvas.addEventListener('mousemove', function(e) {
      if (state.kanbanView !== 'map' || state.activeTab !== 'kanban') return;
      var rect = mapCanvas.getBoundingClientRect();
      var mx = e.clientX - rect.left;
      var my = e.clientY - rect.top;
      var task = findMapTaskAt(mx, my);
      var hub = task ? null : findMapHubAt(mx, my);
      var newId = task ? task.card.id : null;
      var newHubKey = hub ? hub.key : null;
      if (newId !== mapState.hoveredCardId || newHubKey !== mapState.hoveredHubKey) {
        mapState.hoveredCardId = newId;
        mapState.hoveredHubKey = newHubKey;
      }
      if (newId) mapCanvas.style.cursor = 'pointer';
      else if (newHubKey) mapCanvas.style.cursor = 'pointer';
      else mapCanvas.style.cursor = 'default';
      updateMapTooltip(mx, my);
    });
    mapCanvas.addEventListener('mouseleave', function() {
      mapState.hoveredCardId = null;
      mapState.hoveredHubKey = null;
      var tt = $('mapTooltip');
      if (tt) tt.classList.remove('show');
    });
    mapCanvas.addEventListener('click', function(e) {
      if (state.kanbanView !== 'map' || state.activeTab !== 'kanban') return;
      var rect = mapCanvas.getBoundingClientRect();
      var mx = e.clientX - rect.left;
      var my = e.clientY - rect.top;
      var task = findMapTaskAt(mx, my);
      if (task) { mapRipples.push({ x: task.x, y: task.y, color: task.taskColor, t0: performance.now() }); openCardModal(task.col.id, task.card.id); return; }
      var hub = findMapHubAt(mx, my);
      if (hub) {
        mapRipples.push({ x: hub.x, y: hub.y, color: hub.color, t0: performance.now() });
        if (state.mapGrouping === 'due') return;
        if (state.mapGrouping === 'priority') {
          if (state.filters.priority === hub.key) {
            state.filters.priority = ''; $('filterPriority').value = '';
            toast('Фильтр сброшен');
          } else {
            state.filters.priority = hub.key; $('filterPriority').value = hub.key;
            toast('Фильтр: ' + hub.name);
          }
        } else {
          if (state.filters.status === hub.key) {
            state.filters.status = ''; $('filterStatus').value = '';
            toast('Фильтр сброшен');
          } else {
            state.filters.status = hub.key; $('filterStatus').value = hub.key;
            toast('Фильтр: ' + hub.name);
          }
        }
        render();
        renderStats();
        resetMapAnimation();
      }
    });
    mapCanvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  }

  $('btnExport').addEventListener('click', async function() {

    var json = JSON.stringify(packBoard({ docName: $('docName').value }));
    var nat = window.pywebview && window.pywebview.api;

      try {

        toast(saved ? 'Сохранено: ' + saved : 'Экспорт отменён', saved ? 4000 : 1800);
        return;
      } catch (e) {}
    }
    var savedViaPlatform = false;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        var downloads = await window.claude.use('downloads');
        if (downloads) {
          var res = await downloads.save({ filename: name + '.json', data: json });
          savedViaPlatform = !!(res && res.ok !== false);
        }
      }
    } catch (e) {}
    if (!savedViaPlatform) {
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name + '.json';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
